          box, and names its scope: the whole sheet, or one question only.
     2.44 A NOTE SAYS WHETHER IT HAS GONE ANYWHERE. A reader left a note
          and asked on 2026-09-12 how it gets picked up. It does not, until
          Send: a note lives in this browser only. The dock line counted notes
          and never said that. It now counts the notes not sent yet, in red,
          and says to press Send. Once sent, it says the notes reached Claude.
     2.45 THE CHECK BUTTON ALWAYS COMES BACK. A reader on 2026-09-12: "the
          checker button should return everytime (i should be able to keep
          re-triggering it)". It locked while a request waited, and a click
          locked it until the next rebuild. Now it locks only while the save
          is in flight, then returns, reading "check asked for — ask again".
          send() returns its promise so a control can wait on it. A check
          result older than the template stamp on the page is dimmed and says
          it is older than the page.
     2.46 A BOX CAN SIT BELOW THE SEND BAR. A reader on 2026-09-12 asked
          for "changes you want to the questionnaire tool" to go below "Send
          answers to Claude". That box is about the tool, not the round, so it
          does not belong among the answers. New optional flag `below: true` on
          `reply` or `meta` draws that box under the bar, before the sent
          banner and the version badges. It still travels with Send.
     2.47 EXPAND ALL, COLLAPSE ALL. A reader left a note on the questions
          heading on 2026-09-12 asking for both. Two small buttons now sit at
          the right of that heading when there is more than one question. They
          open or shut every question fold, and leave the two boxes about the
          work and the page alone. Each fold remembers its side, as before.
     2.48 THE NOTES LINE NAMES THE BUTTON, AND CARRIES ONE. A reader asked
          "press send where?" about "1 note not sent yet — press Send". The
          line said "Send"; the button reads "Send answers to Claude", and the
          floating panel can cover the bar it sits on. The line now names the
          button in full, and holds a small "send now" button that does the
          same send.
     2.49 THE CHECK BUTTON SITS WITH ITS ANSWER. A reader on 2026-09-12
          asked for the button on the row below the badges, next to the text
          that says when the version was checked. The button asks and that row
          answers, so they now share one row, directly under the badges. With
          no check yet, the row holds the button alone. An old result is grayed
          by color, not opacity, so its button stays at full strength.
          The floating panel no longer vanishes when a sheet has no open
          questions. It still holds the note picker and the new-task card.
     2.50 THREE THINGS A READER ASKED ON 2026-09-12.
          (a) A CLARIFICATION HAS ONE SHAPE. "It's currently always a bit
          decided on the fly ... the structure is different every time." New
          field `clarify: { flagged, changed, what, stakes, example }`. It draws
          five labeled rows in a fixed order: You said, What I changed, What
          this is, Why it matters, For example. Every rewritten question uses
          it, so the reader always knows where to look. SKILL.md makes it the
          rule for any question flagged as not clear.
          (b) "TOO BIG" AND "TWO QUESTIONS" SAY HOW THEY DIFFER. Big is one
          decision with too many parts; two is two decisions glued together.
          (c) NOTE HISTORY. The notes line on the panel gains "show them": a
          list of every note, sent or not sent yet, with its time, what it
          points at, and its text.
     2.51 START THIS NOW IS ONE PRESS. A reader on 2026-09-12: "why if i
          click 'start this now' do i then still have to 'send'. can't that be
          a single action?" The button now sends a narrow request itself:
          `request: { kind: "start-task", task, label, cancel }`. A second press
          takes it back and sends that too. The receipt and the sent banner say
          which. The build drops a spent request once its `at` is listed in the
          sheet field `handled`.
     2.52 THE FLOATING PANEL IS NO LONGER SEE-THROUGH. A reader on 2026-09-12
          saw the collapsed/expanded toggle of a box "bleeding through" the
          panel. Cause: the sticky send bar makes its own layer, and the panel
          sits inside it. Every later element that makes a layer too, such as
          a half-transparent toggle side or the faded version row, painted over
          the bar and its panel. It began in 2.46, which put a box after the
          bar. The bar now carries z-index 30. Checked by hit-test: the point
          over the toggle now lands inside the panel.
     2.53 A TASK-LIST ROW IS A REAL TASK. The decision-to-task pipeline a
          reader chose in round two, started with "start this now" on
          2026-09-12. tasks-bridge.cjs turns every open row into a plan-map
          feature and an Agora task that refs it, and writes `task: { id, ref }`
          onto the row. A row whose task is held on the board shows no start button. build.cjs runs `tasks-bridge.cjs --sync` first, which
          reads each task from the board and writes its state and holder back,
          and moves the row to match. The row shows a chip: task id, board
          state, holder. The plan map follows the board through the daemon.
     2.54 A DECISION SHOWS THE VERSION THAT IMPLEMENTED IT. A reader asked on
          2026-09-12, and said the questionnaire version matters here, not the
          template version. A settled row carries `version`, drawn as a
          small badge after the verdict. build.cjs stamps every row without the
          key with the questionnaire version it is building, and writes that
          back to sheet.json. Rows made before this carry `version: null` and show
          no badge, because the reader did not want it filled in afterward.
     2.55 THE PANEL FOLD BUTTON IS PROMINENT. A reader asked for it. It was a
          bare arrow with no border. It is now an accent pill that says "fold"
          or "open" beside the arrow.
     2.56 A TASK SAYS WHEN IT IS DONE, AND HOW YOU WILL KNOW. A reader asked,
          on a row that read "in progress": "how will i know when this is
          done?" Nothing on the row said. A row now carries `doneWhen`, a list
          of { text, met } conditions. The shut row counts them ("3 of 5 met"),
          and the open row lists them with a tick or a ring. A fixed line says
          what happens at the end: the task closes on the board, the row turns
          green with the date, and the reader gets a push notification.
          tasks-bridge.cjs --sync records `task.doneAt` when a task first
          reads done, and prints DONE NOW, which build.cjs shows.
     2.57 WHO MOVES THE ROW. The same reader: "how will THIS TASK LIST get
          updated when agora is done??" The page cannot look at the board, and
          2.56 did not say who does. A session now watches the board with
          tasks-bridge.cjs --watch and rebuilds the page when a task changes.
          The line says so, and names the limit: the watch lasts only while
          that session is open. With no watch, the row moves on the next round.
          Optional sheet field `watch: { by, since }` names the session.
     2.58 A FOLDED PANEL FOLDS ITS NOTES TOO. A reader on 2026-09-12: "when i
          fold this section. then the notes should also be folded". The notes
          line sat outside the part that folds, so it stayed on the bar. Shut,
          the panel now hides the notes line and its list. One exception: notes
          not sent yet still show, as one short red line with its send button,
          because a hidden unsent note is a note that never reaches Claude.
     2.59 THE TITLE COMES FIRST. The gallery reads a page title only from the
          first 8 KB of the file. This version comment grew past that, so the
          title sat at about byte 28,000 to 40,000, and the gallery named
          sheets by their file name ("fleet", "question-sheet") instead of
          their subject. Another session found it on 2026-09-13. The title
          line is now the first line of the template.
     2.60 START LOCALLY MAKES A CHIP. A reader on 2026-09-20, on the "start
          locally" button: "this should trigger you to create a chip to spawn
          a new task". It used to hand over a claude:// link to copy and paste
          into the Windows Run box, because the page cannot click that link.
          Claude CAN start a task from this conversation: it makes a chip, and
          one press opens a new session on the work. So local is now a
          request, the same shape as the cloud one:
          `request: { kind: "new-task", where: "local", q, title, text, at }`.
          Claude makes the chip and writes a row into `newTasks`, as cloud
          already does. The panel says the honest limit: a chip needs a Claude
          session that watches this page.
     2.61 ONE BUTTON ENDS A QUESTION. A reader on 2026-09-20, under the
          options of a question: "add a button below this that works as a
          'choose this answer and collapse this answer and scroll to the next
          open question". Answering used to take three moves: pick, fold the
          card by its toggle, then hunt for the next open question. The button
          does all three. It keeps the pick that is already saved, shuts the
          card, and opens and scrolls to the next question with no answer.
          With every question answered it reads so, and goes to the Send bar
          instead. It stays disabled until the question HAS an answer, and its
          hover says why, because a control that silently does nothing teaches
          the reader to distrust the others.
     2.62 IS ANYONE LISTENING. A reader on 2026-09-20, on the Send bar:
          "could we add a 'check if listener is alive button?" Every request
          on this page — the version check, start this now, a new task — only
          works while a Claude session watches the page. Nothing said whether
          one does, so a reader could press Send into silence and never know.
          The button asks, in the one way the page can: it sends
          `request: { kind: "ping", at }`. A session that is listening answers
          by rebuilding the page with `listener: { askedAt, at, by }`.
          The row then reads, in green, that Claude answered, how long it took,
          and which session. With no answer it counts UP from the ask, in red
          past two minutes: "asked 4 min ago, no answer yet". The page cannot
          prove a negative faster than that, and it says so rather than
          guessing.
     2.63 SEND NO LONGER WAKES CLAUDE, AND THE PAGE SAYS SO. Found on
          2026-09-21: a reader pressed Send and nothing happened. The Claude
          Code app changed how it watches an artifact. It used to start a turn
          when the page republished itself; it now "starts no turn and sends no
          notification". Only a comment sent to Claude, or a chat message,
          wakes a session. Send still SAVES the answers into the page, so
          nothing is lost, but three lines promised that Claude would see them.
          They now say what really happens: the answers are saved, and Claude
          sees them when a session next reads the page. The ping (2.62) says
          the same, because a republish cannot wake a listener either.
     2.64 SEND TELLS CLAUDE AGAIN. A republish no longer wakes a session
          (2.63), but a page with the full `comments` grant can call
          `comments.sendToClaude`. That posts a comment on this page and
          wakes every Claude session that watches it, exactly like the
          "Send to Claude" button in the comment panel. Send now does that
          FIRST, then saves the answers: the save reloads the page, so a
          comment sent after it would never go out. The comment names the
          send time, so a session that reads the page too early can see the
          save is still in flight. The first send asks the reader once to let
          the page comment for them. Every later send replies into the same
          thread (`answers.claudeThread`), so the page grows one thread,
          not one per send. `answers.told` records the result, and the sent
          banner says it in words: told, or not told and why. A live line
          under the ping row asks the platform whether a session watches the
          page right now. Needs `capabilities: {artifact: {}, comments: {}}`.
          The full comments grant keeps the page inside the organization.
     2.65 BOTH ENDS OF THE PAGE, FROM THE PANEL. A reader on 2026-09-23, on
          the panel: "add a 'go to top of page' and 'go to bottom of page'
          buttons". The panel had one of the two, and it was named for where it
          takes you rather than what it is: "back to top". This sheet is long,
          and the foot holds the version badges, the change log and the boxes
          about the work, so a reader who wanted the end had to scroll it. Two
          buttons now sit together at the end of the list: "go to top of page"
          and "go to bottom of page". Both scroll the page itself, smoothly.
          They sit side by side, because they are one pair with two directions.
     2.66 EACH VERSION BADGE IS ITS OWN TARGET. A reader on 2026-09-23:
          "i can't select these two 'version boxes' individually with the
          annotate option. are these really just a single line and not two
          elements?" They are two elements, and always were: two .ver boxes
          of about 306 and 328 pixels, 6 pixels apart. The comment tool
          could not separate them, because each badge was inline-flex — an
          inline box — so a picker that looks for the nearest BLOCK lands on
          the row that holds both. Each badge is now a block-level flex box,
          and the gap grows from 6 to 12 pixels. The row looks the same,
          because a flex child's own display mode does not change how the
          row lays it out. The same fix goes on the fact chips and the tags,
          which sit in the same kind of row and had the same fault.
     2.67 DARK COLORS NO LONGER SHOW IN LIGHT MODE. Found on 2026-09-23 by a
          headless screenshot of the "Water and Land — Open Calls" sheet, at
          1280 by 1000 pixels in light mode. The "Say what ..." line in the
          status band was light orange (#f5b871) on a light page. The dock
          count was light purple (#a78bfa) on white. The page has three theme
          states. With no data-theme stamp, the system setting chooses the
          theme. The palette obeyed this, but 25 color rules did not. They used
          :root:not([data-theme="light"]) outside the dark media query, and on
          an unstamped page that selector also matches in light mode. So the
          dark color won in light mode, and the dock border was white on a
          white card. Each of the 25 rules now sits inside
          @media (prefers-color-scheme: dark). The :root[data-theme="dark"]
          twins did not change, and no light color changed. A note beside the
          palette now states the rule for the next editor.
     2.68 HOW YOU DECIDE. A reader on 2026-09-28, in the box for tool
          changes: "i'd like a section where there's a summary of my
          decisions (not on a granular level), of how i think in general.
          stuff that could be converted to memory." The Decisions box holds
          every ruling, one by one, with the question that produced it. That
          is a record, not a picture of the reader: 34 rows say what was
          chosen and never say what the reader VALUES.
          New optional field `principles`: a short list of general rules,
          each one distilled from several decisions. A row carries `text`
          (the rule, in the reader's own terms), `from` (the decisions it
          comes from) and `memory` ("saved" when Claude already keeps it as
          a standing rule, "new" when this round distilled it). The box is a
          third fold beside the task list and the decisions, and it says
          plainly which rows are already standing rules and which are not.
          The rule is in SKILL.md: distill after every round, and save a new
          row to memory in the same turn.
     2.69 A RULE CAN BE ADDED OR DROPPED, AND THE LIST CAN BE FILTERED. A
          reader on 2026-09-28, on the new box: "could i get a filter on
          standing rules and on new rules and add a button for me that let's
          me remove or add a 'standing rule'. (include instructions on how
          this works for other agents)". 2.68 only SHOWED which rows Claude
          keeps outside the page; the reader could not change one.
          Three parts:
          (a) A filter row: all, standing rules, new, dropped. Each pill
              carries its count, and the side it is on is remembered per
              browser. A pill with no rows is disabled, never hidden.
          (b) One button per row, and one press does it: "make it standing"
              on a new or dropped row, "drop this rule" on a standing one. It
              sends `request: { kind: "rule", op: "keep" | "drop", i, text }`.
              Claude writes or deletes the standing rule OUTSIDE the page,
              sets `memory` on that row, and rebuilds.
          (c) The box states the mechanism, for the reader and for any agent
              that picks the sheet up: what a standing rule IS, where it
              lives, and that the badge is a claim about Claude's own memory,
              never about this page. `principles[].memory` now takes a third
              value, "dropped": Claude removed it and must not keep it again.
     2.70 THE LEAD PARAGRAPH SAYS WHAT THE SHEET IS. A reader on 2026-09-29
          pointed at the paragraph under the title and asked: "what is this
          section for?!" A fair question, and the paragraph had earned it. It
          held a reply to their last note — "Your note asked for a filter and
          a button..." — so it read as a message about one round, in the one
          place that should say what the whole page is FOR. A reader who
          opens this page cold learned nothing from it.
          Two changes, and they are the same rule twice:
          (a) The paragraph wears a label, WHAT THIS SHEET IS, in the same
              small mono type every other container on the page uses. An
              unlabeled block of prose is the one thing on this page that
              never said which part it was.
          (b) The build WARNS when the lede opens like a round note ("your
              note", "this round", "i built", "i added"). What changed goes
              in the change log and the status band, which both exist for
              it. The lede is the subject.
     2.71 THE FOLD TOGGLE IS A SWITCH. A reader on 2026-11-05, with two
          screenshots: "i don't love this look / color scheme (it doesn't
          give that 'at a glance' feel)". Three faults caused it:
          (a) its green was the same green as ANSWERED, so a display setting
              looked like a status;
          (b) every row carried a red word, and red reads as an error;
          (c) the reader had to READ the state: COLLAPSED and EXPANDED are
              two long capital words of the same shape.
          Four looks went on the meta sheet side by side (q29), and the
          reader picked A: one small switch. Knob left on a gray track means
          the box opens shut; knob right on an amber track means it opens
          expanded. One quiet word beside the switch names the state, so the
          control still names itself (the 2.16 rule). The page's own accent
          lights only open boxes, and green is left to mean "answered".
          Behavior does not change: one press flips the box now and how it
          opens next time, opening the box by its heading moves the switch
          too, and the stored value is still `start`: "open" or "closed".
          The switch is ONE button with role="switch", where 2.16 had two.
          No dark-theme rule was needed: it uses the palette tokens only.
     Builds before 2.0 were unnumbered. The content hash from template-check.cjs
     stays the exactness check; this number is the readable one.
-->
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">

<style id="css">
  :root {
    --ground: #f6f4f0;
    --card: #ffffff;
    --card-2: #f0ece5;
    --ink: #1d1b17;
    --ink-2: #55504a;
    --ink-3: #857e74;
    --line: #ddd6ca;
    --line-2: #c8bfaf;
    --accent: #b96a10;
    --accent-soft: #f6e8d4;
    --accent-ink: #8a4e07;
    --field: #fffdfa;
    --good: #2f6d46;
    --good-soft: #e2f0e6;
    --shadow: 0 1px 2px rgba(29, 27, 23, .06), 0 8px 24px rgba(29, 27, 23, .05);
  }

  /* THREE THEME STATES. No data-theme stamp means "follow the system".
     data-theme="light" and data-theme="dark" force a theme. Every rule that
     starts with :root:not([data-theme="light"]) MUST sit inside
     @media (prefers-color-scheme: dark). Outside it, that selector also
     matches an unstamped page in LIGHT mode, and the dark color wins. Put
     the :root[data-theme="dark"] twin outside, beside it. (2.67) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14161b;
      --card: #1b1e25;
      --card-2: #23272f;
      --ink: #ece8e1;
      --ink-2: #aaa49a;
      --ink-3: #7d776e;
      --line: #2e333c;
      --line-2: #3d434e;
      --accent: #e2952f;
      --accent-soft: #33261440;
      --accent-ink: #f0b968;
      --field: #12151a;
      --good: #6cc48c;
      --good-soft: #1b2c22;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }

  :root[data-theme="dark"] {
    --ground: #14161b;
    --card: #1b1e25;
    --card-2: #23272f;
    --ink: #ece8e1;
    --ink-2: #aaa49a;
    --ink-3: #7d776e;
    --line: #2e333c;
    --line-2: #3d434e;
    --accent: #e2952f;
    --accent-soft: #33261440;
    --accent-ink: #f0b968;
    --field: #12151a;
    --good: #6cc48c;
    --good-soft: #1b2c22;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* Fill the window rather than sit in a fixed column. Running text keeps its
     own readable width below, so widening the page shortens it. */
  .wrap {
    max-width: min(100%, 84rem);
    margin: 0 auto;
    padding: 2rem clamp(1rem, 3vw, 2.5rem) 5rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  header.top {
    display: flex;
    flex-direction: column;
    gap: .5rem;
    padding-bottom: 1.25rem;
    border-bottom: 2px solid var(--line-2);
  }

  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .7rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent-ink);
  }

  h1 {
    font-family: Cinzel, Georgia, serif;
    font-weight: 700;
    font-size: clamp(1.7rem, 4vw, 2.3rem);
    letter-spacing: .02em;
    margin: 0;
    text-wrap: balance;
  }

  /* WHAT THIS SHEET IS (2.70). See the header. Every other container on the
     page names itself; this paragraph did not, so a reader could not tell
     what it was for. */
  .lede-wrap { display: flex; flex-direction: column; gap: .15rem; }
  .lede-lead {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
  }
  .lede { color: var(--ink-2); margin: 0; max-width: 66ch; }

  /* Two version badges at the very top: which template this page was built
     from, and which round of THIS questionnaire is live. Both come from the
     sheet JSON, so a self-republish carries them unchanged. */
  /* ONE BADGE, ONE TARGET (2.66). See the header. `display: flex` (not
     inline-flex) makes each badge a block-level box, so a comment lands on
     the badge the reader pointed at instead of the row around it. The gap
     doubles, so the two boxes read as two. */
  .versions { display: flex; flex-wrap: wrap; gap: .75rem; margin-bottom: .15rem; }
  /* The same row repeated under the button bar. It closes the page rather
     than introducing it, so it sits quieter and keeps its own top margin. */
  .versions.foot { margin: .35rem 0 0; opacity: .85; }
  .ver {
    display: flex; align-items: baseline; gap: .4rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .68rem;
    padding: .18rem .5rem;
    border: 1px solid var(--line-2);
    border-radius: 3px;
    background: var(--card);
  }
  .ver b {
    font-weight: 600;
    font-size: .62rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .ver span { color: var(--accent-ink); font-weight: 500; }
  .ver i { font-style: normal; color: var(--ink-3); }
  .ver i::before { content: "·"; margin: 0 .35rem; color: var(--line-2); }

  .facts { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .35rem; }

  /* THE TAGS THIS SHEET CARRIES (2.28). A reader chose the category system on
     2026-09-06. Tags come from ONE shared list, categories.json in the skill
     folder, and never from the author's head: two sheets can only be seen to
     share a topic if they spell that topic the same way.
     A tag marked OVERLAP appears on another live sheet as well. That is the
     whole point of the row, so it is the one tag that is allowed to shout. */
  .cats { display: flex; flex-wrap: wrap; align-items: baseline; gap: .55rem; margin-top: .55rem; }

  .cats-lead {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .64rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-right: .15rem;
  }

  .cat-tag {
    display: block;                 /* its own target, as the badges are (2.66) */
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .68rem;
    padding: .12rem .45rem;
    border: 1px solid var(--line-2);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink-2);
    white-space: nowrap;
  }

  /* This topic is live on another sheet too. */
  .cat-tag.overlap {
    border-color: #7c3aed;
    color: #7c3aed;
    background: #7c3aed14;
    font-weight: 600;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .cat-tag.overlap { border-color: #a78bfa; color: #a78bfa; }
  }
  :root[data-theme="dark"] .cat-tag.overlap { border-color: #a78bfa; color: #a78bfa; }

  .cat-tag.overlap::after {
    content: " · also on another sheet";
    font-size: .6rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    opacity: .85;
  }

  /* The stated status. One band, so a reader and an agent see the same words. */
  .stated {
    display: flex;
    align-items: flex-start;
    gap: .7rem;
    margin-top: .9rem;
    padding: .7rem .9rem;
    border: 1px solid var(--line);
    border-left: 3px solid var(--ink-3);
    border-radius: 4px;
    background: var(--card);
  }
  /* NEEDS YOU is the loudest state on the page (2.29), because it is the only
     one the reader can DO anything about. It was styled identically to
     "blocked", so the state that wants an action looked like the state that
     forbids one. It now takes a thick edge, its own warm ground, and a ring. */
  .stated.you {
    border-left-width: 6px;
    border-left-color: #b45309;
    border-color: #b45309;
    background: #b4530914;
    box-shadow: 0 0 0 3px #b4530918;
  }
  /* Blocked keeps the quieter accent. Nothing can move, so shouting is wrong. */
  .stated.blocked { border-left-color: var(--accent); background: var(--accent-soft); }
  .stated.claude { border-left-color: var(--ink-3); }
  .stated.done, .stated.parked { border-left-color: var(--good); background: var(--good-soft); }
  .stated.unknown { border-left-color: var(--accent); }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .stated.you {
      border-left-color: #f0a24a; border-color: #f0a24a;
      background: #f0a24a14; box-shadow: 0 0 0 3px #f0a24a18;
    }
  }
  :root[data-theme="dark"] .stated.you {
    border-left-color: #f0a24a; border-color: #f0a24a;
    background: #f0a24a14; box-shadow: 0 0 0 3px #f0a24a18;
  }

  .stated-pill {
    flex: none;
    padding: .1rem .5rem;
    border-radius: 2px;
    background: var(--card-2);
    color: var(--ink-2);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .62rem;
    font-weight: 500;
    letter-spacing: .09em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .stated.you .stated-pill { background: #b45309; color: #fff; font-weight: 700; }
  .stated.blocked .stated-pill { background: var(--accent); color: var(--card); }
  .stated.done .stated-pill, .stated.parked .stated-pill { background: var(--good); color: var(--card); }

  .stated-body { min-width: 0; }

  /* WHAT TO DO, AS A COMMAND (2.29). A reader hit this on 2026-09-06: "if this
     is a 'USER MUST DO ACTION X' box then it should be written in MUCH clearer
     language and coloring". They were right. The band explained the situation
     in prose and never said, in one scannable line, what the reader should do.
     This is that line: a command verb, larger than the explanation, first. */
  .stated-action {
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.35;
    color: #8a4207;
    margin-bottom: .35rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .stated-action { color: #f5b871; }
  }
  :root[data-theme="dark"] .stated-action { color: #f5b871; }
  .stated-action::before {
    content: "→ ";
    opacity: .7;
  }

  /* The explanation is now support, so it steps back from the command. */
  .stated-head { font-size: .92rem; color: var(--ink); }
  .stated-next { margin-top: .25rem; font-size: .86rem; color: var(--ink-2); }
  .stated-next b { color: var(--ink-3); font-weight: 600; }
  .stated-by {
    margin-top: .25rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .66rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .stated-warn { margin-top: .3rem; font-size: .8rem; color: var(--accent-ink); }

  .fact {
    display: block;                 /* its own target, as the badges are (2.66) */
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .72rem;
    padding: .2rem .5rem;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--card-2);
    color: var(--ink-2);
  }

  .sent {
    display: flex;
    align-items: center;
    gap: .55rem;
    padding: .6rem .8rem;
    border: 1px solid var(--good);
    border-radius: 5px;
    background: var(--good-soft);
    color: var(--ink);
    font-size: .875rem;
  }

  /* A draft save is not a request, so it wears a quieter band. */
  .sent.draft { border-color: var(--line-2); background: var(--card-2); }
  .sent.draft .dot { background: var(--ink-3); }

  .sent .dot {
    width: .55rem; height: .55rem; border-radius: 50%;
    background: var(--good); flex: none;
  }

  .q {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 1.1rem 1.2rem 1.2rem;
    display: flex;
    flex-direction: column;
    gap: .75rem;
  }

  .q-head { display: flex; gap: .7rem; align-items: baseline; }

  .num {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .78rem;
    font-weight: 500;
    color: var(--accent-ink);
    background: var(--accent-soft);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: .1rem .4rem;
    flex: none;
    font-variant-numeric: tabular-nums;
  }

  h2 { font-size: 1.05rem; font-weight: 600; margin: 0; text-wrap: balance; }

  .why { margin: 0; font-size: .875rem; color: var(--ink-2); max-width: 62ch; }

  code {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .82em;
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: .05em .3em;
  }

  /* Status badge. Says what changed about this question since last round. */
  .badge {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .6rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: .12rem .4rem;
    border-radius: 3px;
    border: 1px solid currentColor;
    flex: none;
    align-self: center;
  }

  .badge.new { color: var(--good); }
  .badge.updated { color: var(--accent-ink); }
  .badge.clarification { color: #7c3aed; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .badge.clarification { color: #a78bfa; }
  }
  :root[data-theme="dark"] .badge.clarification { color: #a78bfa; }

  /* Switch one question between one answer and several. */
  .multi-toggle {
    display: flex;
    align-items: center;
    gap: .45rem;
    font-size: .74rem;
    color: var(--ink-3);
    cursor: pointer;
    align-self: flex-start;
  }

  .multi-toggle input { accent-color: var(--accent); margin: 0; }
  .multi-toggle:hover { color: var(--ink-2); }
  /* Live, the label states a fact rather than offering an action, so it stops
     looking like a button you have not pressed yet (2.31). */
  .multi-toggle.on { color: var(--accent-ink); font-weight: 500; }

  /* Tell me a question did not land. */
  .unclear {
    border-top: 1px dashed var(--line);
    padding-top: .6rem;
    display: flex;
    flex-direction: column;
    gap: .45rem;
  }

  .unclear > label.head {
    display: flex;
    align-items: center;
    gap: .45rem;
    font-size: .78rem;
    color: var(--ink-3);
    cursor: pointer;
  }

  .unclear > label.head:hover { color: var(--ink-2); }
  .unclear > label.head input { accent-color: #b45309; margin: 0; }

  .unclear-why {
    display: flex;
    flex-direction: column;
    gap: .25rem;
    padding-left: 1.3rem;
  }

  .unclear-why label {
    display: flex;
    gap: .45rem;
    align-items: flex-start;
    font-size: .8rem;
    color: var(--ink-2);
    cursor: pointer;
  }

  .unclear-why input { accent-color: #b45309; margin: .25rem 0 0; flex: none; }
  .unclear-why .hint { display: block; font-size: .74rem; color: var(--ink-3); }

  /* Hand a question back, three ways. A pressed button turns solid, so the
     page always shows which hand-off is live. */
  .defers {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .4rem;
    border-top: 1px dashed var(--line);
    padding-top: .6rem;
  }

  .defers-lead {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .68rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-right: .2rem;
  }

  button.defer {
    font-size: .76rem;
    font-weight: 500;
    padding: .25rem .55rem;
    border-radius: 999px;
    border: 1px solid var(--line-2);
    background: transparent;
    color: var(--ink-2);
  }

  button.defer:hover { border-color: var(--accent); color: var(--accent-ink); }
  button.defer.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .defer-note { font-size: .74rem; color: var(--ink-3); flex-basis: 100%; }

  /* The task list and the decisions, side by side and shut by default.
     They stack on a narrow screen, where two columns would be unreadable. */
  .pair {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr));
    gap: 1rem;
    align-items: start;
  }

  .fold {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--card);
    box-shadow: var(--shadow);
  }

  .fold > summary {
    display: flex;
    align-items: center;
    gap: .55rem;
    cursor: pointer;
    list-style: none;
    padding: .75rem 1rem;
  }

  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary .tri { color: var(--accent); font-size: .8rem; }
  .fold[open] > summary .tri { transform: rotate(90deg); display: inline-block; }

  .fold > summary .fold-title {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .78rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .fold > summary:hover .fold-title { color: var(--ink-2); }
  .fold > summary .count { font-size: .74rem; color: var(--ink-2); }

  /* THE DOCK RIDES ON THE SEND BAR (2.20). It was a separate panel floating
     just above the bar, which put two stacked boxes in one corner. Now it is a
     group at the right-hand end of the bar itself. The bar is already sticky,
     so these controls stay in view at any scroll position, exactly as before,
     and there is no second surface to look at. It sizes to its content, as
     2.19 made it, and drops onto its own line when the bar runs out of room. */
  /* TWO SHAPES, ONE CONTROL (2.22).
     OPEN, it lifts OFF the bar and floats just above it as a small window, a
     vertical list of controls. SHUT, it drops back ONTO the bar as a single
     quiet line: the count and the arrow, nothing more. A reader asked for
     exactly that split, having first asked for it on the bar (2.20) and then
     as a stack (2.21). Both still hold; this says WHICH shape applies WHEN. */
  .dock {
    position: fixed;
    right: clamp(.6rem, 2vw, 1.4rem);
    bottom: 5.5rem;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: .35rem;
    width: fit-content;
    min-width: 11rem;
    max-width: min(24rem, calc(100vw - 2rem));
    padding: .55rem .6rem;
    border: 1px solid var(--line-2);
    border-radius: 8px;
    background: var(--card);
    box-shadow: var(--shadow);
  }

  /* A WHITE OUTLINE ON THE FLOATING PANEL (2.35). A reader asked for it on
     2026-09-08, and it earns its place: the panel is the one surface that
     floats OVER the page, and its old edge was var(--line-2) — the same
     hairline every card on the page already wears. A floating thing that
     wears the same edge as the things it floats over does not read as
     floating.
     White is right in the dark theme, and only there. In the light theme the
     card is already white, so a white edge would erase the panel; that theme
     takes the ink color instead, which is the strongest edge it has. Both say
     the same thing — this surface is on top — in the only way each theme can.
     The SHUT strip keeps no border at all: shut, it is part of the bar, not a
     window on top of anything. */
  .dock { border-color: var(--ink); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .dock { border-color: #ffffff; }
  }
  :root[data-theme="dark"] .dock { border-color: #ffffff; }

  /* Shut, it is part of the bar again, so it drops every trace of a window. */
  .dock.shut {
    position: static;
    z-index: auto;
    flex-direction: row;
    align-items: center;
    gap: .4rem;
    margin-left: auto;
    width: auto;
    min-width: 0;
    max-width: none;
    padding: 0 0 0 .7rem;
    border: none;
    border-left: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }

  .dock-head {
    display: flex;
    align-items: center;
    gap: .35rem;
    /* The handle, while the panel is a window. */
    cursor: grab;
    touch-action: none;
  }

  .dock.shut .dock-head { cursor: default; touch-action: auto; }
  .dock.dragging { cursor: grabbing; user-select: none; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .dock.dragging .dock-head { cursor: grabbing; }

  /* A dragged panel is positioned from the top left, so the default corner
     anchor must give way. */
  .dock[style*="left"] { right: auto; bottom: auto; }

  /* THE ANSWERED COUNT (2.27). It read as gray metadata and vanished into the
     bar. A reader asked for it to carry the same purple the CLARIFICATION
     badge and the MOST COMPLETE tag already use, so the three attention marks
     on this page share one color. It is larger and bolder too, because size
     does as much work as hue. Once every question is answered it turns green,
     which is the page's one "finished" color. */
  .dock-count {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #7c3aed;
    font-variant-numeric: tabular-nums;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .dock-count { color: #a78bfa; }
  }
  :root[data-theme="dark"] .dock-count { color: #a78bfa; }

  .dock.all-done .dock-count { color: var(--good); font-weight: 600; }

  /* THE FOLD BUTTON IS A REAL BUTTON (2.55). A reader asked for it to be more
     prominent. It was a bare 11px arrow with no border, easy to miss. It now
     wears an accent border, says what it does in a word, and keeps the arrow. */
  .dock-fold {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .04em;
    line-height: 1;
    padding: .28rem .55rem;
    margin-left: auto;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent-ink);
    cursor: pointer;
    white-space: nowrap;
  }

  .dock-fold:hover { background: var(--accent); color: #fff; }

  .dock-body { display: flex; flex-direction: column; gap: .3rem; }
  .dock.shut .dock-body { display: none; }
  /* 2.58: shut, the notes fold away; unsent notes keep one short line. */
  .dock.shut .dock-notes:not(.waiting) { display: none; }
  .dock.shut .dock-notes { border-top: none; padding-top: 0; white-space: nowrap; }
  /* In a stack every button spans the group, so the list has one left edge.
     A label WRAPS rather than clips: a reader found the ellipsis in an old
     label and read it as text cut off, which is exactly what a clipped label
     would look like. Nothing here may ever be trimmed. */
  .dock-body .dock-btn {
    width: 100%;
    text-align: left;
    white-space: normal;
    overflow-wrap: anywhere;
    line-height: 1.35;
  }
  /* On a narrow screen the floating shape sits lower and tightens its cap; the
     shut strip wraps onto its own line rather than squeezing the Send button. */
  @media (max-width: 40rem) {
    .dock { bottom: 5rem; max-width: calc(100vw - 1.2rem); }
    .dock.shut { flex-basis: 100%; margin-left: 0; padding: .5rem 0 0;
                 border-left: none; border-top: 1px solid var(--line); }
  }

  /* BOTH ENDS (2.65). One pair, two directions, so they share a row and each
     takes half of it. In the list every other button spans the whole width;
     these two would read as two unrelated jumps if they did the same. */
  .dock-ends { display: flex; gap: .3rem; }
  .dock-body .dock-ends .dock-btn { width: auto; flex: 1 1 0; text-align: center; }

  .dock-btn {
    font-size: .72rem;
    font-weight: 500;
    padding: .22rem .5rem;
    border-radius: 999px;
    cursor: pointer;
  }

  .dock-btn.ghost {
    border: 1px solid var(--line-2);
    background: transparent;
    color: var(--ink-2);
  }

  .dock-btn.ghost:hover:not([disabled]) { border-color: var(--accent); color: var(--accent-ink); }
  .dock-btn.ghost[disabled] { opacity: .45; cursor: default; }
  .dock-btn.go { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .dock-btn.go:hover { filter: brightness(1.08); }

  /* The number row: one square per question, and a map of what is answered. */
  .dock-nums {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(1.9rem, 1fr));
    gap: .25rem;
    margin-top: .1rem;
  }

  .num-jump {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .72rem;
    font-weight: 500;
    padding: .2rem 0;
    border-radius: 4px;
    border: 1px solid var(--line-2);
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }

  .num-jump:hover { border-color: var(--accent); color: var(--accent-ink); }

  /* Answered. The square fills, so the row reads at a glance. */
  .num-jump.done {
    border-color: var(--good);
    background: color-mix(in srgb, var(--good) 18%, transparent);
    color: var(--good);
  }

  .dock.shut .dock-nums { display: none; }

  .dock-notes.waiting { color: #b91c1c; font-weight: 600; }
  .dock-notes .notes-send { margin-left: .3rem; padding: .08rem .5rem; font-size: .66rem; }
  .notes-toggle {
    margin-left: .35rem; padding: 0 .35rem; font-size: .64rem; font-weight: 500;
    border: 1px solid var(--line-2); border-radius: 999px; background: transparent; color: var(--ink-2);
  }
  .notes-list { margin: .35rem 0 0; padding: 0 0 0 1rem; max-height: 14rem; overflow-y: auto;
    display: flex; flex-direction: column; gap: .35rem; font-weight: 400; color: var(--ink-2); }
  .notes-meta { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .6rem; color: var(--ink-3); }
  .notes-state { text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--good); }
  .notes-list li.note-waiting .notes-state { color: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .notes-list li.note-waiting .notes-state { color: #f87171; }
  }
  :root[data-theme="dark"] .notes-list li.note-waiting .notes-state { color: #f87171; }
  .notes-about { font-size: .64rem; color: var(--ink-3); overflow-wrap: anywhere; }
  .notes-text { font-size: .72rem; color: var(--ink); overflow-wrap: anywhere; }

  /* A CLARIFICATION HAS ONE SHAPE (2.50). Label on the left, answer on the
     right, the same rows in the same order every time. */
  .clarify {
    border: 1px solid #7c3aed; border-left-width: 4px; border-radius: 5px;
    padding: .55rem .75rem; display: flex; flex-direction: column; gap: .35rem;
    background: #7c3aed0d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .clarify { border-color: #a78bfa; background: #a78bfa12; }
  }
  :root[data-theme="dark"] .clarify { border-color: #a78bfa; background: #a78bfa12; }
  .clarify-head {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .64rem;
    letter-spacing: .12em; text-transform: uppercase; color: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .clarify-head { color: #a78bfa; }
  }
  :root[data-theme="dark"] .clarify-head { color: #a78bfa; }
  .clarify-row { display: grid; grid-template-columns: 9rem 1fr; gap: .6rem; align-items: baseline; }
  .clarify-k { font-size: .72rem; font-weight: 600; color: var(--ink-3); }
  .clarify-v { font-size: .86rem; color: var(--ink); max-width: 80ch; }
  @media (max-width: 40rem) { .clarify-row { grid-template-columns: 1fr; gap: .1rem; } }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .dock-notes.waiting { color: #f87171; }
  }
  :root[data-theme="dark"] .dock-notes.waiting { color: #f87171; }

  .dock-notes {
    font-size: .7rem;
    color: var(--accent-ink);
    border-top: 1px dashed var(--line);
    padding-top: .35rem;
  }

  /* Point-at-anything mode. The page says plainly that it is armed. */
  body.picking { cursor: crosshair; }
  body.picking .pick-hot {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    background: var(--accent-soft);
  }

  .dock-btn.ghost.on {
    border-color: var(--accent);
    color: var(--accent-ink);
    background: var(--accent-soft);
  }

  .picknote {
    position: fixed;
    right: clamp(.6rem, 2vw, 1.4rem);
    bottom: 5.5rem;
    z-index: 60;
    width: 20rem;
    max-width: calc(100vw - 2rem);
    display: flex;
    flex-direction: column;
    gap: .4rem;
    padding: .7rem .75rem;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: var(--card);
    box-shadow: var(--shadow);
  }

  .picknote-head {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .66rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent-ink);
  }

  .picknote-what {
    font-size: .78rem;
    color: var(--ink-2);
    border-left: 2px solid var(--line-2);
    padding-left: .5rem;
    max-height: 4.5rem;
    overflow: auto;
  }

  .picknote-row { display: flex; gap: .35rem; }

  /* HAND THE SHEET TO A NEW CONVERSATION (2.27).
     The desktop app answers the claude:// scheme, and claude://claude.ai/new
     takes a q parameter that fills the composer. This page cannot FIRE that
     link: the artifact frame forwards only http and https, and swallows every
     other scheme without an error, so a button here would always look broken.
     So the page hands over the text instead. Copy it, and open it yourself. */
  .handoff {
    position: fixed;
    right: clamp(.6rem, 2vw, 1.4rem);
    bottom: 5.5rem;
    z-index: 60;
    width: 26rem;
    max-width: calc(100vw - 2rem);
    display: flex;
    flex-direction: column;
    gap: .45rem;
    padding: .75rem .8rem;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: var(--card);
    box-shadow: var(--shadow);
  }

  .handoff-head {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .66rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent-ink);
  }

  .handoff-say { font-size: .8rem; color: var(--ink-2); margin: 0; }

  .handoff-link {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .72rem;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line-2);
    border-radius: 4px;
    padding: .45rem .5rem;
    width: 100%;
    resize: vertical;
    min-height: 4.5rem;
    word-break: break-all;
  }

  .handoff-row { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }

  .handoff-said { font-size: .72rem; color: var(--good); }
  .handoff-fits { font-size: .76rem; color: var(--good); margin: 0; }

  /* THE NEW-TASK CARD (2.42). Two choices side by side. The picked one turns
     solid, and its panel opens underneath, so the card only ever shows the
     route the reader chose. */
  .task-cell { width: 30rem; max-height: calc(100vh - 7rem); overflow-y: auto; }
  .task-text { font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: .8rem; min-height: 7rem; word-break: normal; }
  .task-count { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .68rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .task-count.over { color: #b91c1c; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .task-count.over { color: #f87171; }
  }
  :root[data-theme="dark"] .task-count.over { color: #f87171; }
  .choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; }
  .choice {
    display: flex; flex-direction: column; align-items: flex-start; gap: .15rem;
    text-align: left; padding: .5rem .6rem; border-radius: 6px;
    border: 1px solid var(--line-2); background: transparent; color: var(--ink);
  }
  .choice b { font-size: .8rem; font-weight: 600; }
  .choice span { font-size: .7rem; font-weight: 400; color: var(--ink-3); line-height: 1.35; }
  .choice:hover { border-color: var(--accent); }
  .choice.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }
  .choice.on b { color: var(--accent-ink); }
  .choice-panel { display: flex; flex-direction: column; gap: .4rem; }
  .choice-panel:empty { display: none; }
  .task-result a { color: var(--accent-ink); font-weight: 600; }
  .handoff-refuse { font-size: .78rem; font-weight: 600; color: #b91c1c; margin: 0; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .handoff-refuse { color: #f87171; }
  }
  :root[data-theme="dark"] .handoff-refuse { color: #f87171; }

  /* THE LETTER COUNTER (2.40). Two fills on one bar: the message as it is
     today, then what your answers would add. Over the limit, the line turns
     the warning color and says so in words, not only in color. */
  .letter-meter { display: flex; flex-direction: column; gap: .3rem; margin: .35rem 0; }
  .letter-bar {
    display: flex;
    height: .5rem;
    border: 1px solid var(--line-2);
    border-radius: 999px;
    background: var(--card-2);
    overflow: hidden;
  }
  .letter-fill.msg { background: var(--accent); }
  .letter-fill.ans { background: #7c3aed; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .letter-fill.ans { background: #a78bfa; }
  }
  :root[data-theme="dark"] .letter-fill.ans { background: #a78bfa; }
  .letter-line { font-size: .74rem; color: var(--ink-2); }
  .letter-line b { font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 600; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
  .letter-line b.ans { color: #7c3aed; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .letter-line b.ans { color: #a78bfa; }
  }
  :root[data-theme="dark"] .letter-line b.ans { color: #a78bfa; }
  .letter-meter.over .letter-bar { border-color: #b91c1c; }
  .letter-meter.over .letter-line { color: #b91c1c; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .letter-meter.over .letter-line { color: #f87171; }
  }
  :root[data-theme="dark"] .letter-meter.over .letter-line { color: #f87171; }
  /* A number the sheet asked to be counted live. */
  .live-count { font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 600; font-variant-numeric: tabular-nums; }
  .handoff-warn { font-size: .72rem; color: var(--ink-3); }

  /* A QUESTION IS A FOLD (2.33). Inside one, the card drops its own frame —
     the fold already draws it — exactly as the task list and decisions do. */
  .fold.qfold > summary { align-items: baseline; gap: .6rem; padding: .8rem 1rem; }
  .fold.qfold > summary .q-head { flex: 1 1 auto; min-width: 0; }
  .fold.qfold > summary h2 { font-size: 1rem; }
  .fold.qfold.flagged { border-color: #b45309; }

  .fold > .q, .fold > .q.meta {
    border: none;
    box-shadow: none;
    background: transparent;
    border-radius: 0;
    border-top: 1px solid var(--line);
    padding: .9rem 1.1rem 1.1rem;
  }

  .fold.qfold.meta > summary h2 { font-size: .95rem; font-weight: 600; }

  /* Where the question stands, said on the shut line. A collapsed card that
     says nothing about its own state hides the reader's answer from them. */
  .q-stand {
    flex: none;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .64rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
    white-space: nowrap;
  }

  .q-stand.set { color: var(--good); font-weight: 600; }

  /* MORE OPTIONS (2.32). The machinery under a question, folded away. It is
     quiet by design: a hairline, small type, no card of its own. The four
     blocks inside keep their own looks exactly as they were.
     When the reader has already used one, the fold opens itself and its
     heading turns accent, because a state they set must never sit behind a
     shut door. */
  .more {
    border-top: 1px dashed var(--line);
    padding-top: .5rem;
  }

  .more > summary {
    display: flex;
    align-items: baseline;
    gap: .45rem;
    cursor: pointer;
    list-style: none;
    padding: .1rem 0;
  }

  .more > summary::-webkit-details-marker { display: none; }
  .more > summary .tri { color: var(--accent); font-size: .7rem; }
  .more[open] > summary .tri { transform: rotate(90deg); display: inline-block; }

  .more-title {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .7rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .more > summary:hover .more-title { color: var(--ink-2); }

  .more-why {
    font-size: .72rem;
    color: var(--ink-3);
    min-width: 0;
    overflow-wrap: anywhere;
  }

  /* Already used. The heading says which one, and the fold starts open. */
  .more.used > summary .more-title,
  .more.used > summary .more-why { color: var(--accent-ink); }
  .more.used > summary .more-why { font-weight: 500; }

  .more-body {
    display: flex;
    flex-direction: column;
    gap: .75rem;
    padding-top: .55rem;
  }

  /* Inside the fold the first block drops its own top rule; the fold carries
     one already, and two hairlines in a row read as a mistake. */
  .more-body > *:first-child { border-top: none; padding-top: 0; }

  /* Send one question on its own. */
  .sendone {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: .5rem;
    border-top: 1px dashed var(--line);
    padding-top: .6rem;
  }

  .sendone-btn {
    font-size: .74rem;
    font-weight: 500;
    padding: .25rem .6rem;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent-ink);
    cursor: pointer;
  }

  .sendone-btn:hover { background: var(--accent); color: #fff; }
  .sendone-note { font-size: .72rem; color: var(--ink-3); }

  /* ANSWER AND MOVE ON (2.61). Under the options, the width of the card. */
  .nextq {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem;
    border-top: 1px dashed var(--line); padding-top: .6rem;
  }
  .nextq-btn {
    font-size: .8rem; font-weight: 600;
    padding: .35rem .8rem; border-radius: 999px;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
    cursor: pointer;
  }
  .nextq-btn:hover:not([disabled]) { filter: brightness(1.08); }
  .nextq-btn[disabled] {
    background: transparent; color: var(--ink-3); border-color: var(--line-2);
    cursor: default;
  }
  .nextq-note { font-size: .74rem; color: var(--ink-3); }

  /* The question the dock jumped to, marked for a moment so it is findable. */
  .q.pinged, .fold.qfold.pinged { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* THE FOLD SWITCH (2.71). See the header. The knob position is the signal:
     left and gray = the box opens shut; right and amber = it opens expanded.
     One quiet word names the state. Palette tokens only, so both themes are
     right with no dark-only rule (2.67). The word keeps a fixed width, so the
     switch sits in the same place on every row. */
  .startside {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: .45rem;
    padding: .15rem .2rem;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--ink-3);
    font-weight: 400;
    cursor: pointer;
    white-space: nowrap;
  }

  .startside .sw-word {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .64rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-3);
    min-width: 6.4em;
    text-align: right;
  }

  .startside .sw-track {
    position: relative;
    flex: none;
    width: 30px;
    height: 16px;
    border-radius: 999px;
    border: 1px solid var(--line-2);
    background: var(--card-2);
    transition: background .15s, border-color .15s;
  }

  .startside .sw-track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--ink-3);
    transition: left .15s, background .15s;
  }

  .startside:hover .sw-track { border-color: var(--accent); }
  .startside.on .sw-word { color: var(--ink-2); }
  .startside.on .sw-track { background: var(--accent-soft); border-color: var(--accent); }
  .startside.on .sw-track::after { left: 16px; background: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    .startside .sw-track, .startside .sw-track::after { transition: none; }
  }

  .fold > summary .remember {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: .3rem;
    font-size: .68rem;
    color: var(--ink-3);
    cursor: pointer;
    white-space: nowrap;
  }

  .fold > summary .remember input { accent-color: var(--accent); margin: 0; pointer-events: none; }
  .fold > summary .remember:hover { color: var(--ink-2); }

  /* Inside a fold the box drops its own frame; the fold carries it. */
  .fold > .tasks, .fold > .settled {
    border: none;
    box-shadow: none;
    background: transparent;
    border-top: 1px solid var(--line);
    border-radius: 0;
    padding-top: .8rem;
  }

  /* ASKED AGAIN. It pulses, because an unanswered question that comes back
     otherwise looks exactly like a new one. The pulse stops for a reader who
     asked their system to reduce motion. */
  .badge.missed {
    color: #b45309;
    background: #b4530918;
    animation: missed-pulse 1.8s ease-in-out infinite;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .badge.missed { color: #f0a24a; }
  }
  :root[data-theme="dark"] .badge.missed { color: #f0a24a; }

  @keyframes missed-pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 currentColor; }
    50% { opacity: .72; box-shadow: 0 0 0 3px transparent; }
  }

  @media (prefers-reduced-motion: reduce) {
    .badge.missed { animation: none; }
  }

  .addressed.missed { border-color: #b45309; background: #b4530910; }
  .addr-missed { font-size: .84rem; font-weight: 600; color: #b45309; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .addr-missed { color: #f0a24a; }
  }
  :root[data-theme="dark"] .addr-missed { color: #f0a24a; }

  /* The receipt band: this question was acted on, and when. */
  .addressed {
    border: 1px solid var(--good);
    background: var(--good-soft);
    border-radius: 5px;
    padding: .5rem .7rem;
    display: flex;
    flex-direction: column;
    gap: .25rem;
  }

  .addressed.stale { border-color: #b45309; background: transparent; }

  .addr-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: .45rem; }
  .addr-mark { color: var(--good); font-weight: 700; flex: none; }
  .addressed.stale .addr-mark { color: #b45309; }

  .addr-word {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .66rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--good);
  }

  .addressed.stale .addr-word { color: #b45309; }

  .addr-when {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .72rem;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }

  .addr-rel { font-size: .72rem; color: var(--ink-3); }
  .addr-what { font-size: .84rem; color: var(--ink); max-width: 80ch; }
  .addr-was { font-size: .78rem; color: var(--ink-3); font-style: italic; }

  .reason-add {
    margin-top: .5rem;
    padding-top: .5rem;
    border-top: 1px dashed var(--line-2);
    display: flex;
    flex-direction: column;
    gap: .3rem;
  }

  .reason-add-label {
    font-size: .8rem;
    font-weight: 500;
    color: var(--ink-2);
  }

  .reason-add textarea {
    width: 100%;
    resize: vertical;
    font: inherit;
    font-size: .82rem;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line-2);
    border-radius: 6px;
    padding: .4rem .5rem;
  }

  .reason-add textarea:focus { outline: 2px solid #b45309; outline-offset: 1px; }
  .reason-add-note { font-size: .72rem; color: var(--ink-3); }

  .q.flagged { border-color: #b45309; }

  .q.meta {
    border-style: dashed;
    border-color: var(--line-2);
    box-shadow: none;
    background: var(--card-2);
  }

  .q.meta h2 { font-size: .95rem; }

  /* The reply box is about the SUBJECT, so it keeps the solid card look. The
     meta box below it stays dashed and quiet. The difference in weight is the
     difference in what each one is for (2.30). */
  .q.reply { border-left: 3px solid var(--accent); }
  .q.reply h2 { font-size: .98rem; }

  /* Optional table styling for a sample block that shows rows of real data. */
  .cat {
    width: 100%;
    border-collapse: collapse;
    font-size: .78rem;
    min-width: 54rem;
  }

  .cat th {
    text-align: left;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .64rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
    padding: .3rem .5rem;
    border-bottom: 1px solid var(--line-2);
    white-space: nowrap;
  }

  .cat td {
    padding: .45rem .5rem;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }

  .cat tr:last-child td { border-bottom: none; }
  .cat img { display: block; width: 360px; border: 1px solid var(--line-2); border-radius: 3px; }
  .cat .nm { font-weight: 600; font-size: .84rem; }
  .cat .purpose { color: var(--ink-2); min-width: 15ch; max-width: 22ch; }

  .addr {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .7rem;
    color: var(--accent-ink);
    background: var(--accent-soft);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: .1rem .3rem;
    white-space: nowrap;
  }

  .caret { color: var(--ink-3); font-size: .66rem; white-space: nowrap; }

  /* Collapsed preview cell. Native details/summary, so it works with no script. */
  .cat details > summary {
    display: flex;
    align-items: center;
    gap: .45rem;
    cursor: pointer;
    list-style: none;
    padding: .15rem 0;
    color: var(--ink-2);
    font-size: .74rem;
    white-space: nowrap;
  }

  .cat details > summary::-webkit-details-marker { display: none; }

  .cat details > summary .tri { color: var(--accent); font-size: .7rem; width: .7rem; }
  .cat details[open] > summary .tri { transform: rotate(90deg); }

  .cat details > summary .mini {
    width: 44px;
    height: 30px;
    object-fit: cover;
    object-position: top left;
    border: 1px solid var(--line-2);
    border-radius: 2px;
    display: block;
  }

  .cat details > summary .mini.empty {
    display: flex;
    align-items: center;
    justify-content: center;
    border-style: dashed;
    color: var(--ink-3);
    font-size: .6rem;
  }

  .cat details > .body { padding: .45rem 0 .2rem; }
  .cat details:hover > summary { color: var(--ink); }

  .pill {
    display: inline-block;
    font-size: .66rem;
    padding: .08rem .35rem;
    border-radius: 999px;
    border: 1px solid var(--line-2);
    white-space: nowrap;
  }

  .pill.ok { color: var(--good); border-color: var(--good); }
  .pill.warn { color: #b45309; border-color: #b45309; }
  .pill.d3 { color: var(--ink-2); }
  .catgroup {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .68rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding: .6rem .5rem .25rem;
  }

  /* Every container on this page wears the same heading, so the page reads as
     four named parts rather than a stack of unlabeled boxes. */
  .section-head {
    display: flex;
    align-items: baseline;
    gap: .55rem;
    margin: .4rem 0 -.4rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .78rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
  }

  .section-head .count { color: var(--ink-2); letter-spacing: .04em; }
  /* EXPAND ALL, COLLAPSE ALL (2.47). Quiet, at the right of the heading. */
  .all-folds { margin-left: auto; display: flex; gap: .3rem; }
  .all-fold {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .64rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase;
    padding: .12rem .5rem; border-radius: 999px;
    border: 1px solid var(--line-2); background: transparent; color: var(--ink-3);
  }
  .all-fold:hover { border-color: var(--accent); color: var(--accent-ink); }

  .section-head .hint {
    letter-spacing: .02em;
    text-transform: none;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: .78rem;
    color: var(--ink-3);
  }

  /* The changelog. Folded by default, because it only grows. */
  .log {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--card);
    box-shadow: var(--shadow);
  }

  .log > summary {
    display: flex;
    align-items: baseline;
    gap: .6rem;
    cursor: pointer;
    list-style: none;
    padding: .8rem 1.1rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .78rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .log > summary::-webkit-details-marker { display: none; }
  .log > summary:hover { color: var(--ink-2); }
  .log > summary .tri { color: var(--accent); }
  .log[open] > summary .tri { transform: rotate(90deg); display: inline-block; }
  .log > summary .latest { letter-spacing: .04em; text-transform: none; color: var(--ink-2); }

  .log .body { padding: 0 1.1rem 1rem; display: flex; flex-direction: column; gap: .9rem; }

  .log .entry { display: flex; flex-direction: column; gap: .3rem; }

  .log .when {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .68rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
    display: flex;
    gap: .5rem;
    align-items: baseline;
  }

  .log .when .name { color: var(--ink); letter-spacing: .04em; text-transform: none; font-weight: 600; }
  .log .when .clock { font-variant-numeric: tabular-nums; }
  .log .when .ago { color: var(--ink-3); letter-spacing: .04em; text-transform: none; }
  .log ul { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: .18rem; }
  .log li { font-size: .86rem; line-height: 1.45; color: var(--ink-2); }

  .log .tag {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .58rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    border: 1px solid currentColor;
    border-radius: 3px;
    padding: 0 .25rem;
    margin-right: .4rem;
    vertical-align: .08em;
  }

  .log .tag.page { color: #7c3aed; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .log .tag.page { color: #a78bfa; }
  }
  :root[data-theme="dark"] .log .tag.page { color: #a78bfa; }
  .log .tag.skill { color: var(--accent-ink); }
  .log .tag.fix { color: #b45309; }

  /* The running task list. It grows as the sheet moves through its phases. */
  .tasks {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--card);
    padding: .9rem 1.1rem 1rem;
    display: flex;
    flex-direction: column;
    gap: .55rem;
    box-shadow: var(--shadow);
  }

  .tasks h3 {
    margin: 0;
    font-size: .78rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
    display: flex;
    align-items: baseline;
    gap: .6rem;
  }

  .tasks .count { color: var(--ink-2); letter-spacing: .04em; }

  .tasks .bar {
    height: 4px;
    border-radius: 2px;
    background: var(--card-2);
    overflow: hidden;
  }

  .tasks .bar > span { display: block; height: 100%; background: var(--good); }

  .tasks .group {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .66rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-top: .35rem;
  }

  .tasks ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .22rem; }

  .tasks li {
    display: flex;
    gap: .55rem;
    align-items: baseline;
    font-size: .86rem;
    line-height: 1.45;
  }

  /* 2.8: a task row that describes its work opens like a decision row. */
  .tasks details > summary {
    display: flex;
    gap: .55rem;
    align-items: baseline;
    cursor: pointer;
    list-style: none;
    font-size: .86rem;
    line-height: 1.45;
  }
  .tasks details > summary::-webkit-details-marker { display: none; }
  .tasks details > summary:hover .txt { color: var(--ink); }
  .tasks details > .work {
    margin: .3rem 0 .5rem 1.65rem;
    padding-left: .7rem;
    border-left: 2px solid var(--line-2);
    font-size: .82rem;
    line-height: 1.5;
    color: var(--ink-2);
    max-width: 74ch;
  }
  .tasks .work p.work-detail { margin: 0 0 .25rem; }
  .tasks .work ul.work-scope { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: .15rem; }
  .tasks .work .from {
    display: block;
    margin-top: .3rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .66rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .tasks .mark { flex: none; width: 1.1rem; text-align: center; font-weight: 700; }
  .tasks li.done .mark { color: var(--good); }
  .tasks li.done .txt { color: var(--ink-2); }
  .tasks li.doing .mark { color: var(--accent); }
  .tasks li.doing .txt { color: var(--ink); font-weight: 600; }
  .tasks li.blocked .mark { color: #b45309; }
  .tasks li.blocked .txt { color: var(--ink-2); }
  .tasks li.todo .mark { color: var(--ink-3); }
  .tasks li.todo .txt { color: var(--ink-2); }
  .tasks .who { color: var(--ink-3); font-size: .78rem; }
  /* A ROW THAT IS A REAL TASK (2.53). */
  .task-chip {
    margin-left: .45rem; padding: 0 .4rem; border-radius: 3px; white-space: nowrap;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .6rem; font-weight: 500;
    letter-spacing: .04em; border: 1px solid var(--line-2); color: var(--ink-3); vertical-align: .1em;
  }
  .task-chip.claimed, .task-chip.in_progress { border-color: var(--accent); color: var(--accent-ink); }
  .task-chip.done { border-color: var(--good); color: var(--good); }
  .task-chip.blocked { border-color: #b45309; color: #b45309; }
  /* DONE WHEN (2.56). The count rides on the shut row; the list sits inside. */
  .done-count {
    margin-left: .35rem; padding: 0 .4rem; border-radius: 3px; white-space: nowrap;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .6rem; font-weight: 600;
    letter-spacing: .04em; border: 1px dashed var(--line-2); color: var(--ink-2); vertical-align: .1em;
  }
  .done-count.all { border-style: solid; border-color: var(--good); color: var(--good); }
  .tasks .work .done-when { margin: .45rem 0 .1rem; }
  .tasks .work .done-when-head {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .62rem;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
  }
  .tasks .work .done-when ul { margin: .15rem 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .12rem; }
  .tasks .work .done-when li { display: flex; gap: .45rem; align-items: baseline; font-size: .82rem; }
  .tasks .work .done-when .dw-mark { flex: none; width: .9rem; text-align: center; font-weight: 700; color: var(--ink-3); }
  .tasks .work .done-when li.met .dw-mark { color: var(--good); }
  .tasks .work .done-when li.met .dw-text { color: var(--ink-2); }
  .tasks .work .done-when li.open .dw-text { color: var(--ink); font-weight: 500; }
  .tasks .work .done-how {
    margin-top: .35rem; padding: .35rem .5rem; border-radius: 4px;
    background: var(--card-2); font-size: .78rem; color: var(--ink-2);
  }
  .tasks .work .done-how b { color: var(--ink); font-weight: 600; }

  /* START THIS NOW (2.37). Quiet until pressed. Once pressed it is solid,
     because a request the reader has made must be visible at a glance. */
  .task-start {
    flex: none;
    margin-left: auto;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .62rem;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: .1rem .45rem;
    border-radius: 999px;
    border: 1px solid var(--line-2);
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
    white-space: nowrap;
  }

  .task-start:hover { border-color: var(--accent); color: var(--accent-ink); }
  .task-start.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* The receipt under a pressed row. It states the limit and offers the
     one thing the page CAN do without waiting for a reply. */
  .task-asked {
    margin: .15rem 0 .35rem 1.65rem;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: .4rem;
    font-size: .74rem;
    color: var(--accent-ink);
  }

  .task-asked .copy {
    font-size: .68rem;
    font-weight: 500;
    padding: .08rem .4rem;
    border-radius: 999px;
    border: 1px solid var(--line-2);
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
  }

  .task-asked .copy:hover { border-color: var(--accent); color: var(--accent-ink); }
  .task-asked .said { color: var(--good); }

  .settled {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--card);
    padding: .9rem 1.1rem 1rem;
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }

  .settled h3 {
    margin: 0;
    font-size: .78rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
  }

  .settled ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .3rem; }

  /* HOW YOU DECIDE (2.68). See the header. It wears the decisions look, so
     the two read as one family: the rulings, and what they add up to. */
  .principles { display: flex; flex-direction: column; gap: .5rem; }
  .principles > p { margin: 0; font-size: .8rem; color: var(--ink-3); max-width: 70ch; }
  .principles ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .5rem; }
  .principles li { display: flex; gap: .5rem; align-items: baseline; font-size: .88rem; line-height: 1.45; }
  .principles .mark { flex: none; color: var(--accent); font-weight: 700; }
  .principles .say { color: var(--ink); }
  .principles .from {
    display: block; margin-top: .15rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);
  }
  /* SAVED means Claude keeps this as a standing rule, outside this page. NEW
     means this round distilled it and it is not a standing rule yet. */
  .mem {
    margin-left: .4rem; padding: 0 .35rem; border-radius: 3px; white-space: nowrap;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .58rem; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; border: 1px solid currentColor; vertical-align: .1em;
  }
  .mem.saved { color: var(--good); }
  .mem.new { color: #7c3aed; }
  .mem.dropped { color: var(--ink-3); }
  .principles li.is-dropped .say { color: var(--ink-3); text-decoration: line-through; }
  /* THE FILTER AND THE PER-ROW BUTTON (2.69). See the header. */
  .prin-filter { display: flex; flex-wrap: wrap; gap: .3rem; }
  .prin-pill {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .62rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: .14rem .55rem; border-radius: 999px;
    border: 1px solid var(--line-2); background: transparent; color: var(--ink-3); cursor: pointer;
  }
  .prin-pill:hover:not([disabled]) { border-color: var(--accent); color: var(--accent-ink); }
  .prin-pill.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
