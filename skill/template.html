  .prin-pill[disabled] { opacity: .4; cursor: default; }
  .prin-act {
    margin-left: .4rem; padding: .05rem .45rem; border-radius: 999px;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .58rem; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
    border: 1px dashed var(--line-2); background: transparent; color: var(--ink-3); cursor: pointer;
    white-space: nowrap; vertical-align: .1em;
  }
  .prin-act:hover:not([disabled]) { border-style: solid; border-color: var(--accent); color: var(--accent-ink); }
  .prin-act[disabled] { opacity: .5; cursor: default; }
  .prin-how {
    margin: 0; padding: .4rem .55rem; border-radius: 4px; background: var(--card-2);
    font-size: .74rem; color: var(--ink-2);
  }
  .prin-how b { color: var(--ink); font-weight: 600; }
  /* A dark color lives inside the dark media query (2.67), or it wins in
     light mode on a page with no theme stamp. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .mem.new { color: #a78bfa; }
  }
  :root[data-theme="dark"] .mem.new { color: #a78bfa; }

  .settled li {
    display: flex;
    gap: .5rem;
    align-items: baseline;
    font-size: .86rem;
    line-height: 1.4;
  }

  /* A decision opens to show what locked it in. Native details, so it needs
     no state and works with the keyboard for free. */
  .settled details > summary {
    display: flex;
    gap: .5rem;
    align-items: baseline;
    cursor: pointer;
    list-style: none;
    font-size: .86rem;
    line-height: 1.4;
  }

  .settled details > summary::-webkit-details-marker { display: none; }
  .settled details > summary:hover .what { color: var(--ink); }

  .settled details > .why {
    margin: .3rem 0 .5rem 1.5rem;
    padding-left: .7rem;
    border-left: 2px solid var(--line-2);
    font-size: .82rem;
    line-height: 1.5;
    color: var(--ink-2);
    max-width: 74ch;
  }

  /* The two voices of a reason: one for a person, one for an agent. Each
     block wears a small label so the reader picks their lane at a glance. */
  .settled details > .why .voice { display: block; margin-bottom: .35rem; }
  .settled details > .why .voice-tag {
    display: block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .6rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: .1rem;
  }
  .settled details > .why .voice.tech { color: var(--ink-3); }
  .settled details > .why .voice.tech .voice-tag { color: var(--accent-ink); }

  .settled details > .why .from {
    display: block;
    margin-top: .25rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .66rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .settled .tick { color: var(--good); flex: none; font-weight: 700; }
  .settled .what { color: var(--ink-2); }
  .settled .verdict { color: var(--ink); font-weight: 600; }
  .settled .decided-in {
    margin-left: .45rem; padding: 0 .35rem; border-radius: 3px; white-space: nowrap;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .6rem; font-weight: 500;
    border: 1px solid var(--line-2); color: var(--accent-ink); vertical-align: .1em;
  }

  .answer {
    border-left: 3px solid var(--accent);
    background: var(--card-2);
    border-radius: 0 4px 4px 0;
    padding: .65rem .8rem;
    font-size: .875rem;
    display: flex;
    flex-direction: column;
    gap: .4rem;
  }

  .answer .tag {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .66rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent-ink);
  }

  .answer p { margin: 0; max-width: 90ch; }
  .answer ul { margin: 0; padding-left: 1.1rem; }
  .answer li { margin: .15rem 0; }

  .sample {
    border: 1px dashed var(--line-2);
    border-radius: 5px;
    padding: .8rem;
    background: var(--card-2);
    display: flex;
    flex-direction: column;
    gap: .75rem;
    overflow-x: auto;
  }

  .sample-cap {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .66rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  /* Header mockups. These copy the real Design Preview header, which is dark
     in both themes, so they keep their own fixed colors on purpose. */
  .mock {
    display: flex;
    align-items: center;
    gap: .4rem;
    background: #111827;
    border: 1px solid #374151;
    border-radius: 6px;
    padding: .4rem .5rem;
    font-size: .62rem;
    color: #9ca3af;
    min-width: 34rem;
  }

  .mock .brand { font-family: Cinzel, Georgia, serif; color: #e5e7eb; font-size: .7rem; letter-spacing: .04em; }
  .mock .row { display: flex; gap: .2rem; border: 1px solid #374151; border-radius: 4px; padding: .15rem; }
  .mock .chip { padding: .12rem .35rem; border-radius: 3px; white-space: nowrap; }
  .mock .chip.on { background: #d97706; color: #fff; }
  .mock .chip.step-on { background: #0ea5e9; color: #fff; }
  .mock .spacer { flex: 1; }

  .mock .target {
    background: #15803d;
    color: #fff;
    padding: .18rem .45rem;
    border-radius: 3px;
    white-space: nowrap;
    box-shadow: 0 0 0 2px rgba(21, 128, 61, .35);
  }

  .mock-note { font-size: .78rem; color: var(--ink-2); margin: .15rem 0 0; }

  .shots { display: flex; gap: .9rem; flex-wrap: wrap; align-items: flex-start; }
  .shot { display: flex; flex-direction: column; gap: .3rem; }
  .shot img { display: block; border: 1px solid var(--line-2); border-radius: 4px; }

  .shot .cap {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .66rem;
    color: var(--ink-3);
  }

  .opts { display: flex; flex-direction: column; gap: .35rem; }

  .opt {
    display: flex;
    gap: .6rem;
    align-items: flex-start;
    padding: .5rem .65rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--field);
    cursor: pointer;
    transition: border-color .12s, background .12s;
  }

  .opt:hover { border-color: var(--line-2); }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
  .opt input { margin: .32rem 0 0; accent-color: var(--accent); flex: none; }
  .opt .label { font-size: .9rem; }
  .opt .note { display: block; font-size: .8rem; color: var(--ink-3); }

  .opt.rec { border-color: var(--accent); }
  .opt.rec .label > .name { font-weight: 600; }

  .rec-badge {
    display: inline-block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .58rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent-ink);
    border: 1px solid var(--accent);
    border-radius: 3px;
    padding: .05rem .3rem;
    margin-left: .4rem;
    vertical-align: .05em;
  }

  .why-rec {
    display: block;
    font-size: .78rem;
    color: var(--accent-ink);
    margin-top: .25rem;
  }

  .pc { display: flex; flex-wrap: wrap; gap: .15rem 1rem; margin-top: .3rem; }

  .pc > div {
    display: flex;
    gap: .35rem;
    align-items: flex-start;
    font-size: .78rem;
    line-height: 1.4;
    flex: 1 1 16rem;
  }

  .pc .k { flex: none; font-weight: 700; }
  .pc .pro .k { color: var(--good); }
  .pc .con .k { color: #b45309; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .pc .con .k { color: #f0a24a; }
  }
  :root[data-theme="dark"] .pc .con .k { color: #f0a24a; }
  .pc .v { color: var(--ink-2); }

  .free { display: flex; flex-direction: column; gap: .3rem; }

  .free > span {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .68rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  textarea {
    font-family: inherit;
    font-size: .9rem;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: .55rem .65rem;
    resize: vertical;
    min-height: 2.6rem;
    width: 100%;
  }

  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  /* THE BAR SITS ON TOP OF LATER CONTENT (2.52). A reader saw a toggle
     "bleeding through" the floating panel. A sticky bar makes its own layer,
     and the panel lives inside it. Anything AFTER the bar that makes a layer
     too, such as a half-transparent toggle side or the faded version row,
     painted over the whole bar and its panel. 2.46 put a box after the bar,
     which is when it started. A z-index lifts the bar and its panel above. */
  footer.actions {
    z-index: 30;
    position: sticky;
    bottom: 0;
    display: flex;
    gap: .6rem;
    align-items: center;
    flex-wrap: wrap;
    padding: .8rem 1rem;
    background: var(--card);
    border: 1px solid var(--line-2);
    border-radius: 6px;
    box-shadow: var(--shadow);
  }

  button {
    font-family: inherit;
    font-size: .875rem;
    font-weight: 600;
    padding: .5rem .9rem;
    border-radius: 4px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }

  button.ghost { background: transparent; color: var(--ink-2); border-color: var(--line-2); }
  button[disabled] { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }

  .status { font-size: .82rem; color: var(--ink-2); }

  /* ASK CLAUDE TO CHECK THE VERSION (2.39). Quiet, and beside the badges it
     is about. Pending, it says so and stops taking clicks. */
  .ver-ask {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .66rem;
    font-weight: 400;
    letter-spacing: .04em;
    padding: .18rem .55rem;
    border: 1px dashed var(--line-2);
    border-radius: 3px;
    background: transparent;
    color: var(--ink-3);
  }
  .ver-ask:hover:not([disabled]) { border-style: solid; border-color: var(--accent); color: var(--accent-ink); }
  .ver-ask.pending { border-style: solid; border-color: var(--accent); color: var(--accent-ink); opacity: 1; }

  .ver-result { font-size: .74rem; color: var(--ink-2); margin-top: -.2rem; }
  .ver-result b { font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 500; font-size: .66rem; color: var(--good); text-transform: uppercase; letter-spacing: .06em; }
  .ver-result.moved b { color: var(--accent-ink); }
  .ver-result { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .2rem; }
  .ver-result .ver-ask { margin-left: .6rem; }
  /* IS ANYONE LISTENING (2.62). Green once answered, red while nothing has. */
  .listen-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .2rem; font-size: .74rem; color: var(--ink-2); }
  .listen-row b {

  .listen-row.waiting b { color: var(--ink-3); }

  @media (prefers-color-scheme: dark) {

  :root[data-theme="dark"] .listen-row.late b { color: #f87171; }

  /* SEND TELLS CLAUDE (2.64). One line in the sent banner, one live line. */
  .sent { flex-wrap: wrap; }
  .sent .told { display: block; flex-basis: 100%; padding-left: 1.1rem; font-size: .78rem; color: var(--good); }
  .sent .told.not { color: #b45309; }
  /* Saved but NOT told is not a success, so it does not wear the green. */

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .sent .told.not { color: #fbbf24; }
  }
  :root[data-theme="dark"] .sent .told.not { color: #fbbf24; }
  .ver-result.old { color: var(--ink-3); }
  .ver-result.old b { color: var(--ink-3); }

  /* The three saves, told apart in one line under the buttons (2.34). */
  .bar-note {
    flex-basis: 100%;
    font-size: .72rem;
    line-height: 1.5;
    color: var(--ink-3);
    border-top: 1px dashed var(--line);

  .out {
    font-family: "IBM Plex Mono", ui-monospace, monospace;

    white-space: pre-wrap;
    background: var(--field);

    border-radius: 4px;

  /* Each option sits in a wrap so the comment button is not inside the
     label — a button inside a label toggles the choice when clicked. */
  .opt-wrap { position: relative; }
  .opt-wrap .opt { margin: 0; padding-right: 2.4rem; }

  .opt-comment {
    position: absolute;
    top: .38rem;
    right: .4rem;
    width: 1.7rem;
    height: 1.7rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: 4px;
    border: 1px solid transparent;
    background: transparent;

  }

  .opt-wrap:hover .opt-comment { opacity: 1; }
  .opt-comment:hover { color: var(--accent-ink); border-color: var(--line-2); }
  .opt-comment:focus-visible { opacity: 1; outline: 2px solid var(--accent); outline-offset: 1px; }
  .opt-comment.has { opacity: 1; color: var(--accent); }
  .opt-comment svg { width: .95rem; height: .95rem; display: block; }

  .opt-comment-box {
    margin: .3rem 0 0 1.7rem;
    width: calc(100% - 1.7rem);
    max-width: calc(100% - 1.7rem);
    font-size: .84rem;
    border-style: dashed;
    min-height: 2.2rem;
  }

  .opt-comment-box:focus { border-style: solid; }

  /* Most complete, and the fast mitigation. Neither is a recommendation. */
  .tag-badge {
    display: inline-block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .58rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    border: 1px solid currentColor;
    border-radius: 3px;
    padding: .05rem .3rem;
    margin-left: .4rem;
    vertical-align: .05em;

  .tag-badge.extensive { color: #6d28d9; }
  .tag-badge.quick { color: #0e7490; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .tag-badge.extensive { color: #a78bfa; }
    :root:not([data-theme="light"]) .tag-badge.quick { color: #67e8f9; }
  }
  :root[data-theme="dark"] .tag-badge.extensive { color: #a78bfa; }
  :root[data-theme="dark"] .tag-badge.quick { color: #67e8f9; }

  .own-wrap { display: flex; flex-direction: column; gap: .35rem; position: relative; }
  .own-wrap .opt { margin: 0; }
  .own-box {
    font: inherit;
    font-size: .88rem;
    color: var(--ink);
    background: var(--field);
    border: 1px dashed var(--line-2);
    border-radius: 4px;
    padding: .45rem .55rem;
    resize: vertical;
    margin-left: 1.7rem;
    width: calc(100% - 1.7rem);
    max-width: calc(100% - 1.7rem);
  }
  .own-box:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-style: solid; }

  /* Picked. The green edge says the typed answer is the live choice. */
  .own-box.is-chosen {
    border-color: var(--good);
    border-style: solid;
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--good) 22%, transparent);
  }

  [hidden] { display: none !important; }
</style>

<div id="app"></div>

<script type="application/json" id="sheet">
__SHEET_JSON__
</script>

<script type="application/json" id="answers">
{"picks":{},"notes":{},"own":{},"comments":{},"multi":{},"unclear":{},"newReasons":{},"defer":{},"pageNotes":[],"start":{},"focus":null,"draft":false,"sentAt":null}
</script>

<script id="runtime">
(function () {
  var RUNTIME = document.currentScript ? document.currentScript.textContent : "";
  var KEY = "__STORAGE_KEY__";

  function readJson(id, fallback) {
    var el = document.getElementById(id);
    if (!el) return fallback;
    try { return JSON.parse(el.textContent); } catch (e) { return fallback; }
  }

  var SHEET = readJson("sheet", { questions: [] });
  var SAVED = readJson("answers", { picks: {}, notes: {}, sentAt: null });

  // Why a question did not land. The viewer ticks these, Claude acts on them.
  //
  // "I DO NOT SEE WHY IT MATTERS" USED TO BE ONE OPTION AND IT MEANT TWO THINGS.
  // A reader reported it directly: either they do not care about the question,
  // or they genuinely do not understand what the problem entails. Those want
  // opposite replies. One wants the subject explained; the other wants the
  // stakes justified, or the question dropped. A single tick could not say
  // which, so the safe reading was always "explain it" — which is patronising
  // to every reader who meant the other thing.
  //
  // `why` KEEPS ITS ID and its original meaning, so answers recorded before the
  // split still resolve correctly. `what` is the new one.
  var UNCLEAR_REASONS = [
    { id: "jargon", label: "Too much jargon", hint: "Words only someone in the code would know." },
    { id: "what", label: "I do not follow what this is about", hint: "Explain the thing itself, not the choices." },
    { id: "example", label: "I need a visual example", hint: "Draw it or show me a screenshot." },
    { id: "live", label: "I need to see it myself", hint: "Give me a link I can click and look at." },
    { id: "why", label: "I follow it, but not why it matters", hint: "Say what breaks if this goes the wrong way, or drop it." },
    { id: "conflict", label: "This fights an earlier answer", hint: "Say which one, and I will settle it." },
    { id: "options", label: "None of the options fit", hint: "The choice I want is not on the list." },
    // `big` and `two` read alike, and a reader asked how they differ (2.50).
    // BIG is ONE decision with too many parts to hold at once. TWO is two
    // separate decisions glued into one question. The hints now say so.
    { id: "big", label: "Too big to answer in one go", hint: "One decision, but too many parts to weigh at once. Break it into steps." },
    { id: "unknown", label: "I need a number I do not have", hint: "Go and measure it, then ask me again." },
    { id: "two", label: "This is really two questions", hint: "Two separate decisions glued together. Pull them apart, and I will answer each." }
  ];

  var state = { picks: {}, notes: {}, own: {}, comments: {}, multi: {}, unclear: {}, newReasons: {}, defer: {}, pageNotes: [], start: {}, reply: "", sentAt: SAVED.sentAt || null };

  // Published answers are the shared truth. Local drafts win only when the
  // viewer typed after the last send.
  state.picks = JSON.parse(JSON.stringify(SAVED.picks || {}));
  state.notes = JSON.parse(JSON.stringify(SAVED.notes || {}));
  state.multi = JSON.parse(JSON.stringify(SAVED.multi || {}));
  state.unclear = JSON.parse(JSON.stringify(SAVED.unclear || {}));
  state.own = JSON.parse(JSON.stringify(SAVED.own || {}));
  state.comments = JSON.parse(JSON.stringify(SAVED.comments || {}));
  state.newReasons = JSON.parse(JSON.stringify(SAVED.newReasons || {}));
  state.defer = JSON.parse(JSON.stringify(SAVED.defer || {}));
  state.pageNotes = JSON.parse(JSON.stringify(SAVED.pageNotes || []));
  state.start = JSON.parse(JSON.stringify(SAVED.start || {}));
  state.reply = SAVED.reply || "";

  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var local = JSON.parse(raw);
      if (local && (!state.sentAt || (local.touchedAt || "") > state.sentAt)) {
        state.picks = local.picks || state.picks;
        state.notes = local.notes || state.notes;
        state.multi = local.multi || state.multi;
        state.unclear = local.unclear || state.unclear;
        state.own = local.own || state.own;
        state.comments = local.comments || state.comments;
        state.newReasons = local.newReasons || state.newReasons;
        state.defer = local.defer || state.defer;
        state.pageNotes = local.pageNotes || state.pageNotes;
        state.start = local.start || state.start;
        state.reply = local.reply || state.reply;
      }
    }
  } catch (e) {}

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* One small speech bubble, drawn inline so no network request is made. */
  function commentIcon() {
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("fill", "none");
    svg.setAttribute("aria-hidden", "true");
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", "M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v6A1.5 1.5 0 0 1 12.5 11H6.8L3.6 13.7A.4.4 0 0 1 3 13.4V11h-.5A1.5 1.5 0 0 1 2 9.5z");
    p.setAttribute("stroke", "currentColor");
    p.setAttribute("stroke-width", "1.3");
    p.setAttribute("stroke-linejoin", "round");
    svg.appendChild(p);
    return svg;
  }

  /* A comment on ONE option. The Notes box is for the question as a whole;
     this is for questioning a single choice without losing which one. */
  function attachComment(wrap, qid, label, persist) {
    var saved = (state.comments[qid] || {})[label] || "";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opt-comment" + (saved ? " has" : "");
    btn.title = "Comment on this option";
    btn.setAttribute("aria-label", "Comment on " + label);
    btn.appendChild(commentIcon());

    var box = document.createElement("textarea");
    box.className = "opt-comment-box";
    box.rows = 2;
    box.placeholder = "A question or a note about this option only";
    box.value = saved;
    box.hidden = !saved;

    btn.addEventListener("click", function () {
      box.hidden = !box.hidden;
      if (!box.hidden) box.focus();
    });
    box.addEventListener("input", function () {
      if (!state.comments[qid]) state.comments[qid] = {};
      if (box.value) state.comments[qid][label] = box.value;
      else delete state.comments[qid][label];
      btn.classList.toggle("has", !!box.value);
      persist();
    });

    wrap.appendChild(btn);
    wrap.appendChild(box);
  }

  /* Small per-browser view settings: which folds start open, and whether the
     dock is folded away. Never sent anywhere. */
  var UIKEY = KEY + "-ui";
  function readUiRoot() {
    try { return JSON.parse(localStorage.getItem(UIKEY) || "{}") || {}; }
    catch (e) { return {}; }
  }
  function writeUiRoot(ui) {
    try { localStorage.setItem(UIKEY, JSON.stringify(ui)); } catch (e) {}
  }

  var app = document.getElementById("app");
  var statusNode, sendBtn, outNode;

  // THE DOCK: a small panel pinned to the bottom right, in view at any scroll
  // position. Asked for by a reader on 2026-09-01, who wanted it unobtrusive.
  //
  // It answers the two things a long sheet hides: how much is left, and where
  // the next unanswered question is. It stays faint until pointed at, folds to
  // a single pill, and never covers the button bar.
  // Every "answer and move on" button repaints from here (2.61), because a
  // pick made anywhere on the card changes what that button may do.
  var nextButtons = [];
  function paintNextButtons() { nextButtons.forEach(function (f) { f(); }); }

  var notesOpen = false;
  var dockNode = null, dockCount = null, dockNext = null, dockNotes = null,
      dockNums = null;

  /** Scroll one question into view and mark it for a moment. */
  function jumpToQuestion(id) {
    var idx = (SHEET.questions || []).map(function (q) { return q.id; }).indexOf(id);
    if (idx < 0) return;
    // The meta box is a section.q too, and it sits after the questions, so an
    // index lookup is safe only within the question count.
    var secs = document.querySelectorAll("section.q");
    var sec = secs[idx];
    if (!sec) return;
    // A QUESTION IS A FOLD NOW (2.33), and every fold starts shut. Jumping to
    // a shut question would land the reader on one closed line, so the jump
    // OPENS it first. The mark then goes on the fold, which is the thing they
    // can actually see.
    var box = sec.closest ? sec.closest("details.qfold") : null;
    if (box && !box.open) box.open = true;
    var mark = box || sec;
    mark.scrollIntoView({ behavior: "smooth", block: "center" });
    mark.classList.add("pinged");
    setTimeout(function () { mark.classList.remove("pinged"); }, 1400);
  }

  /** Answered means a pick, typed text, or a hand-back. Not silence. */
  function answeredIds() {
    var out = [];
    (SHEET.questions || []).forEach(function (q) {
      var pick = state.picks[q.id];
      var has = Array.isArray(pick) ? pick.length > 0 : !!pick;
      if (has || state.own[q.id] || state.defer[q.id]) out.push(q.id);
    });
    return out;
  }

  function updateDock() {
    if (!dockNode) return;
    var all = (SHEET.questions || []).map(function (q) { return q.id; });
    var done = answeredIds();
    dockCount.textContent = all.length ? done.length + " of " + all.length + " answered" : "no open questions";
    dockNode.classList.toggle("all-done", all.length > 0 && done.length === all.length);
    var pending = all.filter(function (id) { return done.indexOf(id) === -1; });
    dockNext.disabled = pending.length === 0;
    dockNext.hidden = all.length === 0;
    dockNext.textContent = pending.length
      ? "go to next unanswered"
      : "every question answered";
    dockNext.dataset.target = pending.length ? pending[0] : "";
    if (dockNums) {
      dockNums.querySelectorAll(".num-jump").forEach(function (n) {
        var got = done.indexOf(n.dataset.qid) !== -1;
        n.classList.toggle("done", got);
        n.title = "Question " + n.textContent + (got ? " — answered" : " — not answered yet");
      });
    }
    if (dockNotes) {
      // A NOTE SAYS WHETHER IT HAS GONE ANYWHERE (2.44). A reader left one
      // and asked how it gets "picked up". It does not, until Send: a note
      // lives in this browser only. The line now counts the notes Claude has
      // not received yet, and says what to press.
      var n = state.pageNotes.length;
      var sentN = SAVED.draft ? 0 : (SAVED.pageNotes || []).length;
      var waiting = Math.max(0, n - sentN);
      // THE LINE NAMES THE BUTTON, AND CARRIES ONE (2.48). A reader asked
      // "press send where?" The line said "Send" and the button reads "Send
      // answers to Claude", on a bar the panel can cover. It now names the
      // button in full, and puts a send button right on the line.
      var shutNow = dockNode.classList.contains("shut");
      dockNotes.textContent = !n ? ""
        : (waiting && shutNow) ? waiting + (waiting === 1 ? " note" : " notes") + " not sent "
        : waiting
          ? waiting + (waiting === 1 ? " note" : " notes") + " not sent yet. Claude gets "
            + (waiting === 1 ? "it" : "them") + " when you press Send answers to Claude. "
          : n + (n === 1 ? " note sent to Claude" : " notes sent to Claude");
      if (waiting) {
        var sendNotes = document.createElement("button");
        sendNotes.type = "button";
        sendNotes.className = "dock-btn go notes-send";
        sendNotes.textContent = "send now";
        sendNotes.title = "The same as Send answers to Claude on the bar: your answers and your notes go together.";
        sendNotes.addEventListener("click", function () { send(); });
        dockNotes.appendChild(sendNotes);
      }
      dockNotes.classList.toggle("waiting", !!waiting);
      dockNotes.title = "A note stays in this browser until you press Send. Send carries it to Claude with your answers, and Claude acts on it.";
      dockNotes.hidden = !n;

      // WHICH NOTES WENT, AND WHAT THEY SAID (2.50). A reader asked "how do i
      // know what note was sent? can i see the note history?" The line only
      // counted. A "show them" toggle now lists every note: sent or not sent
      // yet, when it was left, what it points at, and the note itself.
      if (n && !shutNow) {
        var showNotes = document.createElement("button");
        showNotes.type = "button";
        showNotes.className = "notes-toggle";
        showNotes.textContent = notesOpen ? "hide them" : "show them";
        showNotes.addEventListener("click", function () {
          notesOpen = !notesOpen;
          updateDock();
        });
        dockNotes.appendChild(showNotes);
        if (notesOpen) {
          var list = el("ol", "notes-list");
          state.pageNotes.forEach(function (pn, i) {
            var li = el("li", i < sentN ? "note-sent" : "note-waiting");
            var top = el("div", "notes-meta");
            top.appendChild(el("span", "notes-state", i < sentN ? "sent" : "not sent yet"));
            var d = new Date(pn.at);
            if (!isNaN(d.getTime())) {
              top.appendChild(document.createTextNode(" · " + d.toLocaleString(undefined,
                { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })));
            }
            li.appendChild(top);
            li.appendChild(el("div", "notes-about", "on: " + (pn.about || "").slice(0, 80)));
            li.appendChild(el("div", "notes-text", pn.note));
            list.appendChild(li);
          });
          dockNotes.appendChild(list);
        }
      }
    }
  }

  // POINT AT ANYTHING AND LEAVE A NOTE.
  //
  // A reader asked for this on 2026-09-01: a button that starts an element
  // picker inside the page, so a note can be attached to whatever they click.
  //
  // It is NOT the claude.ai comment system. A published page cannot reach it.
  // This writes into the answers instead, through the one channel the page
  // has, and Claude reads the notes beside the answers. The effect is the
  // same; the route is different, and the page says so.
  var pickOn = false, pickHover = null, pickBox = null;

  /** A short address for one element: tag, id, classes, and its position. */
  function pathOf(node) {
    var parts = [];
    var n = node;
    while (n && n.nodeType === 1 && parts.length < 6 && n !== document.body) {
      var bit = n.tagName.toLowerCase();
      if (n.id) { bit += "#" + n.id; parts.unshift(bit); break; }
      var cls = (n.className && typeof n.className === "string")
        ? n.className.trim().split(/\s+/).slice(0, 2).join(".") : "";
      if (cls) bit += "." + cls;
      var sibs = n.parentNode ? [].slice.call(n.parentNode.children) : [];
      var same = sibs.filter(function (x) { return x.tagName === n.tagName; });
      if (same.length > 1) bit += ":nth(" + (same.indexOf(n) + 1) + ")";
      parts.unshift(bit);
      n = n.parentNode;
    }
    return parts.join(" > ");
  }

  /** What the reader would say they clicked on. */
  function labelOf(node) {
    var t = (node.textContent || "").replace(/\s+/g, " ").trim();
    if (t.length > 90) t = t.slice(0, 88) + "…";
    return t || node.tagName.toLowerCase();
  }

  function stopPicking() {
    pickOn = false;
    document.body.classList.remove("picking");
    if (pickHover) { pickHover.classList.remove("pick-hot"); pickHover = null; }
    document.removeEventListener("mouseover", onPickOver, true);
    document.removeEventListener("click", onPickClick, true);
    document.removeEventListener("keydown", onPickKey, true);
    if (pickBtn) {
      pickBtn.classList.remove("on");
      pickBtn.textContent = "leave a note";
    }
  }

  function onPickOver(ev) {
    var t = ev.target;
    if (!t || t.nodeType !== 1) return;
    if (t.closest && t.closest(".dock")) return;
    if (pickHover) pickHover.classList.remove("pick-hot");
    pickHover = t;
    t.classList.add("pick-hot");
  }

  function onPickKey(ev) {
    if (ev.key === "Escape") { ev.preventDefault(); stopPicking(); }
  }

  function onPickClick(ev) {
    var t = ev.target;
    if (t && t.closest && t.closest(".dock")) return;
    ev.preventDefault();
    ev.stopPropagation();
    var target = t;
    stopPicking();
    openNoteBox(target);
  }

  function openNoteBox(target) {
    if (pickBox) pickBox.remove();
    var box = el("div", "picknote");
    box.appendChild(el("div", "picknote-head", "A note on what you clicked"));
    box.appendChild(el("div", "picknote-what", labelOf(target)));
    var ta = document.createElement("textarea");
    ta.rows = 3;
    ta.placeholder = "What should change here?";
    box.appendChild(ta);
    var row = el("div", "picknote-row");
    var save = document.createElement("button");
    save.type = "button";
    save.className = "dock-btn go";
    save.textContent = "Keep note";
    save.addEventListener("click", function () {
      var text = ta.value.trim();
      if (!text) { ta.focus(); return; }
      state.pageNotes.push({
        path: pathOf(target),
        about: labelOf(target),
        note: text,
        at: new Date().toISOString()
      });
      persist();
      box.remove();
      pickBox = null;
      updateDock();
    });
    var drop = document.createElement("button");
    drop.type = "button";
    drop.className = "dock-btn ghost";
    drop.textContent = "Cancel";
    drop.addEventListener("click", function () { box.remove(); pickBox = null; });
    row.appendChild(save);
    row.appendChild(drop);
    box.appendChild(row);
    document.body.appendChild(box);
    pickBox = box;
    ta.focus();
  }

  var pickBtn = null;

  // THE HAND-OFF (2.27). A reader asked whether I had missed a way to open a
  // desktop conversation from outside. I had. The desktop app registers the
  // claude:// scheme, and claude://claude.ai/new takes a q parameter that
  // fills the composer of a NEW chat. Text over about 14,000 characters is
  // cut, and every value must be URL-encoded.
  //
  // THE PAGE MUST NOT FIRE THE LINK. The artifact frame forwards a click to
  // the host only when the protocol is http or https. Any other scheme dies
  // inside the sandbox with no error, so a claude:// button always looks
  // broken whether the link is good or not. The page therefore hands the text
  // to the reader, who opens it from the Run box, a shortcut or a terminal.
  var handoffNode = null;

  // THE LETTER COUNTER (2.40). A reader asked on 2026-09-12, on the paragraph
  // that said how much room the hand-off message has: "can i get a 'letter
  // counter'? so i know how many letters there are?" The paragraph gave two
  // numbers in prose, and both went stale the moment the reader typed.
  // These are live. Every character counts — letters, spaces, punctuation —
  // because that is what the link limit counts.
  var HANDOFF_LIMIT = 14000;

  // EVERY ANSWER AS TEXT (2.41). asText() prints only the questions still on
  // the page. A settled question keeps its answer in `state`, and the hand-off
  // carries those too, so they are added here, once, for both users of it.
  function answersText() {
    var live = {};
    (SHEET.questions || []).forEach(function (q) { live[q.id] = true; });
    var out = asText();
    var extra = [];
    ["picks", "own", "notes"].forEach(function (k) {
      Object.keys(state[k] || {}).forEach(function (id) {
        if (live[id] || id.indexOf("__") === 0) return;
        var v = state[k][id];
        var t = Array.isArray(v) ? v.join(", ") : String(v || "");
        if (!t) return;
        extra.push("   " + id + (k === "picks" ? " > " : " " + k + ": ") + t);
      });
    });
    if (extra.length) out += String.fromCharCode(10) + "SETTLED QUESTIONS" + String.fromCharCode(10) + extra.join(String.fromCharCode(10));
    return out;
  }

  function letterCounts() {
    var message = handoffText(true).length;
    var answers = answersText().length;
    var both = handoffText(false).length;
    return { message: message, answers: answers, both: both, limit: HANDOFF_LIMIT };
  }

  function fmtCount(n) { return Number(n).toLocaleString(); }

  // One meter: a bar and a line of words. `extra` is what would be added.
  function letterMeter() {
    var c = letterCounts();
    var box = el("div", "letter-meter");
    var bar = el("div", "letter-bar");
    var fillMsg = el("span", "letter-fill msg");
    var fillAns = el("span", "letter-fill ans");
    fillMsg.style.width = Math.min(100, c.message / c.limit * 100) + "%";
    fillAns.style.width = Math.max(0, Math.min(100, c.both / c.limit * 100) - Math.min(100, c.message / c.limit * 100)) + "%";
    bar.appendChild(fillMsg);
    bar.appendChild(fillAns);
    box.appendChild(bar);
    var over = c.both > c.limit;
    if (over) box.classList.add("over");
    var line = el("div", "letter-line");
    line.appendChild(document.createTextNode("WHOLE SHEET: "));
    line.appendChild(el("b", null, fmtCount(c.message)));
    line.appendChild(document.createTextNode(" letters in the message · "));
    line.appendChild(el("b", "ans", fmtCount(c.answers)));
    line.appendChild(document.createTextNode(" in all your answers, every question · "));
    line.appendChild(el("b", null, fmtCount(c.limit)));
    line.appendChild(document.createTextNode(" fit. "
      + (over ? "Both together do NOT fit." : "Both together fit, with " + fmtCount(c.limit - c.both) + " to spare.")));
    box.appendChild(line);
    box.title = "Every character counts: letters, spaces and punctuation. The count changes as you type.";
    return box;
  }

  // Fill every counter the sheet asks for. A sheet writes
  //   <span data-count="message|answers|both|limit|spare"></span>
  // for a number in its own prose, or <div data-meter></div> for the bar.
  function refreshCounts() {
    var c = letterCounts();
    c.spare = c.limit - c.both;
    var nodes = document.querySelectorAll("[data-count]");
    for (var i = 0; i < nodes.length; i++) {
      var k = nodes[i].getAttribute("data-count");
      if (k in c) {
        nodes[i].textContent = fmtCount(c[k]);
        nodes[i].classList.add("live-count");
      }
    }
    var meters = document.querySelectorAll("[data-meter]");
    for (var j = 0; j < meters.length; j++) {
      meters[j].innerHTML = "";
      meters[j].appendChild(letterMeter());
    }
  }

  // `short` leaves the answers out. The full form is the default (2.41).
  function handoffText(short) {
    var lines = [
      "Take over this question sheet: " + (SHEET.pageUrl || location.href),
      "",
      "Read the page first. Say what you understood before you act.",
      "Sheet: " + (SHEET.title || "untitled") + " (" + ((SHEET.sheetVersion || {}).id || "?") + ")",
      "Template: " + ((SHEET.templateVersion || {}).id || "?")
    ];
    var done = answeredIds();
    var open = (SHEET.questions || []).filter(function (q) { return done.indexOf(q.id) === -1; });
    if (open.length) {
      lines.push("", "Still open: " + open.map(function (q) {
        return "#" + ((SHEET.questions || []).indexOf(q) + 1) + " " + q.title;
      }).join("; "));
    }
    if (!short) {
      lines.push("", "MY ANSWERS SO FAR, copied off the page:", "", answersText());
    }
    return lines.join(String.fromCharCode(10));
  }

  // A NEW TASK, STARTED LOCALLY OR IN THE CLOUD (2.42). A reader on
  // 2026-09-12, on the hand-off button: "can't this button function as a
  // 'cell' that you pop up for a new task that i can then choose start locally
  // or in the cloud?" It can, and it replaces the hand-off panel.
  //
  // The card holds the task text, which the reader may edit, and two choices.
  // Neither one can be started by the page itself, so both ASK Claude over
  // Send, the same way the version check does (2.39). LOCAL asks for a task
  // chip in the conversation: one press starts a session on this machine
  // (2.60). CLOUD asks Claude to start the task on a remote machine. Claude
  // writes the result of either into `newTasks`.
  //
  // `scope` is null for the whole sheet, or one question for "Give this its
  // own thread", which opens the same card narrowed to that question.
  function taskText(scope, short) {
    if (!scope) return handoffText(short);
    var n = (SHEET.questions || []).indexOf(scope) + 1;
    var lines = [
      "Take over one question from this sheet as its own task: " + (SHEET.pageUrl || location.href),
      "",
      "Read the page first. Say what you understood before you act.",
      "If it needs more than three questions, use the question-sheet skill.",
      "",
      "Question " + n + ": " + scope.title
    ];
    if (scope.why) lines.push("Why it matters: " + scope.why);
    if (!short) {
      var mine = [];
      var pick = state.picks[scope.id];
      if (Array.isArray(pick) ? pick.length : pick) mine.push("Pick: " + (Array.isArray(pick) ? pick.join(", ") : pick));
      if (state.own[scope.id]) mine.push("My own answer: " + state.own[scope.id]);
      if (state.notes[scope.id]) mine.push("My note: " + state.notes[scope.id]);
      var cm = state.comments[scope.id] || {};
      Object.keys(cm).forEach(function (k) { mine.push("On \"" + k + "\": " + cm[k]); });
      if (mine.length) lines.push("", "WHAT I SAID ON IT:", mine.join(String.fromCharCode(10)));
    }
    return lines.join(String.fromCharCode(10));
  }

  function openHandoff(scope) {
    if (handoffNode) { handoffNode.remove(); handoffNode = null; if (!scope) return; }
    scope = (scope && scope.id) ? scope : null;

    // YOUR ANSWERS RIDE ALONG, OR THE CARD SAYS WHY NOT (2.41).
    var full = taskText(scope, false);
    var fits = full.length <= HANDOFF_LIMIT;

    var box = el("div", "handoff task-cell");
    box.appendChild(el("div", "handoff-head",
      "start a new task" + (scope ? " · question " + ((SHEET.questions || []).indexOf(scope) + 1) : " · this whole sheet")));
    box.appendChild(el("p", "handoff-say",
      "This is what the new task starts with. Change it if you like, then pick where it runs."));

    var text = document.createElement("textarea");
    text.className = "handoff-link task-text";
    text.value = fits ? full : taskText(scope, true);
    box.appendChild(text);

    var count = el("div", "task-count", "");
    box.appendChild(count);
    if (!fits) {
      box.appendChild(el("p", "handoff-refuse", "Your answers do NOT fit in a link: the full text is "
        + fmtCount(full.length) + " letters, and the limit is " + fmtCount(HANDOFF_LIMIT)
        + ". The box holds the short form. The cloud choice has no such limit."));
    }

    var choices = el("div", "choice-row");
    var localBtn = document.createElement("button");
    localBtn.type = "button";
    localBtn.className = "choice";
    localBtn.appendChild(el("b", null, "start locally"));
    localBtn.appendChild(el("span", null, "Claude makes a task chip here. One press starts a session on this machine"));
    var cloudBtn = document.createElement("button");
    cloudBtn.type = "button";
    cloudBtn.className = "choice";
    cloudBtn.appendChild(el("b", null, "start in the cloud"));
    cloudBtn.appendChild(el("span", null, "Claude starts it on a remote machine and links it here"));
    choices.appendChild(localBtn);
    choices.appendChild(cloudBtn);
    box.appendChild(choices);

    var panel = el("div", "choice-panel");
    box.appendChild(panel);

    var mode = null;
    function paintCount() {
      var n = text.value.length;
      var over = n > HANDOFF_LIMIT;
      // THE COUNT SAYS WHAT IT COUNTS (2.43). A reader asked whether the
      // number was for the whole sheet or one question. It is for the text in
      // this box, and the box is the whole sheet or one question, so the line
      // now says which.
      count.textContent = fmtCount(n) + " of " + fmtCount(HANDOFF_LIMIT) + " letters, in the box above · "
        + (scope ? "question " + ((SHEET.questions || []).indexOf(scope) + 1) + " only" : "the whole sheet, with all your answers")
        + (over ? " — too long for a link" : "");
      count.classList.toggle("over", over);
      if (mode === "local") drawLocal();
    }

    // LOCAL IS A CHIP (2.60). See the header. The page cannot start a session
    // and cannot click a claude:// link, but Claude can put a one-press chip
    // in the conversation, so the local route asks for that.
    function drawLocal() {
      mode = "local";
      localBtn.classList.add("on"); cloudBtn.classList.remove("on");
      panel.textContent = "";
      panel.appendChild(el("p", "handoff-say",
        "Claude puts a task chip in the conversation. Press that chip, and a new session starts on this text"
        + (SHEET.workdir ? ", in " + SHEET.workdir + "." : ".")
        + " Nothing runs until you press it."));
      panel.appendChild(el("div", "handoff-warn",
        "It works only while a Claude session watches this page. If no session is watching, the chip is made on the next round."));
      var ask = document.createElement("button");
      ask.type = "button";
      ask.className = "dock-btn go";
      ask.textContent = "ask Claude for a task chip";
      ask.addEventListener("click", function () {
        ask.disabled = true;
        ask.textContent = "asking Claude…";
        send(null, false, {
          kind: "new-task",
          where: "local",
          q: scope ? scope.id : null,
          title: scope ? scope.title : (SHEET.title || "this sheet"),
          text: text.value
        });
      });
      panel.appendChild(ask);
    }

    function drawCloud() {
      mode = "cloud";
      cloudBtn.classList.add("on"); localBtn.classList.remove("on");
      panel.textContent = "";
      panel.appendChild(el("p", "handoff-say",
        "This page cannot start a cloud session itself. It asks Claude, the same way Send does. "
        + "Claude starts the task on a remote machine and writes its link back on this page, under the version badges."));
      panel.appendChild(el("div", "handoff-warn",
        "It works only while a Claude session watches this page. If the cloud start is not available, Claude says so here."));
      var ask = document.createElement("button");
      ask.type = "button";
      ask.className = "dock-btn go";
      ask.textContent = "ask Claude to start it in the cloud";
      ask.addEventListener("click", function () {
        ask.disabled = true;
        ask.textContent = "asking Claude…";
        send(null, false, {
          kind: "new-task",
          where: "cloud",
          q: scope ? scope.id : null,
          title: scope ? scope.title : (SHEET.title || "this sheet"),
          text: text.value
        });
      });
      panel.appendChild(ask);
    }

    localBtn.addEventListener("click", drawLocal);
    cloudBtn.addEventListener("click", drawCloud);
    text.addEventListener("input", paintCount);
    paintCount();

    var row = el("div", "handoff-row");
    var shut = document.createElement("button");
    shut.type = "button";
    shut.className = "dock-btn ghost";
    shut.textContent = "close";
    shut.addEventListener("click", function () { box.remove(); handoffNode = null; });
    row.appendChild(shut);
    box.appendChild(row);

    document.body.appendChild(box);
    handoffNode = box;
  }

  function startPicking() {
    if (pickOn) { stopPicking(); return; }
    pickOn = true;
    document.body.classList.add("picking");
    if (pickBtn) {
      pickBtn.classList.add("on");
      pickBtn.textContent = "click anything · Esc to stop";
    }
    document.addEventListener("mouseover", onPickOver, true);
    document.addEventListener("click", onPickClick, true);
    document.addEventListener("keydown", onPickKey, true);
  }

  var dockHead = null;

  /** Put the panel at a point, kept whole inside the window. */
  function placeDock(left, top) {
    if (!dockNode) return;
    var w = dockNode.offsetWidth, h = dockNode.offsetHeight;
    var maxL = Math.max(4, window.innerWidth - w - 4);
    var maxT = Math.max(4, window.innerHeight - h - 4);
    dockNode.style.left = Math.min(Math.max(4, left), maxL) + "px";
    dockNode.style.top = Math.min(Math.max(4, top), maxT) + "px";
  }

  /** Re-apply the remembered spot, or leave it in its default corner. */
  function restoreDockPos() {
    if (!dockNode || dockNode.classList.contains("shut")) return;
    var pos = readUiRoot().dockPos;
    if (pos && typeof pos.left === "number" && typeof pos.top === "number") {
      placeDock(pos.left, pos.top);
    }
  }

  function buildDock() {
    // THE PANEL STAYS WHEN THE QUESTIONS RUN OUT (2.49). It holds the note
    // picker and the new-task card, which a finished sheet still needs.
    var ui = readUiRoot();
    var box = el("div", "dock" + (ui.dockShut ? " shut" : ""));

    var fold = document.createElement("button");
    fold.type = "button";
    fold.className = "dock-fold";
    fold.title = "Lift this off the bar as a small window, or drop it back on";
    fold.textContent = ui.dockShut ? "open ▴" : "fold ▾";
    fold.addEventListener("click", function () {
      box.classList.toggle("shut");
      var shut = box.classList.contains("shut");
      fold.textContent = shut ? "open ▴" : "fold ▾";
      var u = readUiRoot();
      u.dockShut = shut;
      writeUiRoot(u);
      if (shut) { box.style.left = ""; box.style.top = ""; }
      else restoreDockPos();
      updateDock();
    });

    var head = el("div", "dock-head");
    dockCount = el("span", "dock-count", "");
    head.appendChild(dockCount);
    head.appendChild(fold);
    box.appendChild(head);

    // DRAG IT WHERE YOU WANT IT (2.24). Once the panel pops off the bar it is
    // a window, and a window that cannot be moved will sooner or later sit on
    // top of the thing you are reading. The head row is the handle.
    //
    // The position is kept in this browser only, and clamped to the window on
    // every apply, so a panel dragged on a wide screen cannot end up off the
    // edge of a narrow one. Double-click the head to send it home.
    dockHead = head;
    head.title = "Drag to move this panel. Double-click to send it back to the corner.";

    var drag = null;
    head.addEventListener("pointerdown", function (ev) {
      if (box.classList.contains("shut")) return;      // on the bar, not a window
      if (ev.target.closest("button")) return;         // the fold arrow is not a handle
      var r = box.getBoundingClientRect();
      drag = { dx: ev.clientX - r.left, dy: ev.clientY - r.top };
      placeDock(r.left, r.top);
      box.classList.add("dragging");
      try { head.setPointerCapture(ev.pointerId); } catch (e) {}
      ev.preventDefault();
    });
    head.addEventListener("pointermove", function (ev) {
      if (!drag) return;
      placeDock(ev.clientX - drag.dx, ev.clientY - drag.dy);
    });
    function endDrag(ev) {
      if (!drag) return;
      drag = null;
      box.classList.remove("dragging");
      try { head.releasePointerCapture(ev.pointerId); } catch (e) {}
      var u = readUiRoot();
      var r = box.getBoundingClientRect();
      u.dockPos = { left: Math.round(r.left), top: Math.round(r.top) };
      writeUiRoot(u);
    }
    head.addEventListener("pointerup", endDrag);
    head.addEventListener("pointercancel", endDrag);

    head.addEventListener("dblclick", function () {
      if (box.classList.contains("shut")) return;
      var u = readUiRoot();
      delete u.dockPos;
      writeUiRoot(u);
      box.style.left = "";
      box.style.top = "";
    });

    dockNotes = el("div", "dock-notes", "");
    dockNotes.hidden = true;
    box.appendChild(dockNotes);

    var body = el("div", "dock-body");

    dockNext = document.createElement("button");
    dockNext.type = "button";
    dockNext.className = "dock-btn ghost";
    dockNext.addEventListener("click", function () {
      var id = dockNext.dataset.target;
      if (id) jumpToQuestion(id);
    });
    body.appendChild(dockNext);

    // JUMP STRAIGHT TO A NUMBER (2.25). "Next unanswered" only ever walks
    // forward. A reader asked to reach a question by its number instead, so
    // every question gets a small square here. The square also SAYS whether
    // that question is answered, which makes this row a map of the sheet as
    // well as a way to move around it.
    dockNums = el("div", "dock-nums");
    (SHEET.questions || []).forEach(function (q, i) {
      var n = document.createElement("button");
      n.type = "button";
      n.className = "num-jump";
      n.textContent = String(i + 1);
      n.dataset.qid = q.id;
      n.addEventListener("click", function () { jumpToQuestion(q.id); });
      dockNums.appendChild(n);
    });
    body.appendChild(dockNums);

    pickBtn = document.createElement("button");
    pickBtn.type = "button";
    pickBtn.className = "dock-btn ghost";
    pickBtn.textContent = "leave a note";
    pickBtn.title = "Point at anything on this page and leave a note on it. Escape cancels.";
    pickBtn.addEventListener("click", startPicking);
    body.appendChild(pickBtn);

    // HAND THIS SHEET TO A NEW CONVERSATION (2.27). See openHandoff.
    var hand = document.createElement("button");
    hand.type = "button";
    hand.className = "dock-btn ghost";
    hand.textContent = "start a new task";
    hand.title = "Open a card for a new task about this sheet. Start it locally, or ask Claude to start it in the cloud.";
    hand.addEventListener("click", function () { openHandoff(null); });
    body.appendChild(hand);

    // BOTH ENDS OF THE PAGE (2.65). See the header. "back to top" said where
    // it goes, not what it is; its twin was missing altogether.
    var ends = el("div", "dock-ends");
    var top = document.createElement("button");
    top.type = "button";
    top.className = "dock-btn ghost";
    top.textContent = "go to top of page";
    top.title = "Scroll to the very start of this page: the title and the version badges.";
    top.addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    ends.appendChild(top);

    var bottom = document.createElement("button");
    bottom.type = "button";
    bottom.className = "dock-btn ghost";
    bottom.textContent = "go to bottom of page";
    bottom.title = "Scroll to the very end of this page: the change log and the foot badges.";
    bottom.addEventListener("click", function () {
      var doc = document.documentElement;
      window.scrollTo({ top: Math.max(doc.scrollHeight, document.body.scrollHeight), behavior: "smooth" });
    });
    ends.appendChild(bottom);
    body.appendChild(ends);

    box.appendChild(body);
    dockNode = box;
    updateDock();
    // The spot is applied after layout, so the width and height are real.
    setTimeout(restoreDockPos, 0);
    return box;
  }

  // A window narrowed after a drag must not strand the panel off screen.
  window.addEventListener("resize", function () {
    if (!dockNode || dockNode.classList.contains("shut")) return;
    if (!dockNode.style.left) return;
    placeDock(parseFloat(dockNode.style.left), parseFloat(dockNode.style.top));
  });

  function render() {
    app.textContent = "";
    var wrap = el("div", "wrap");

    var head = el("header", "top");
    head.appendChild(el("div", "eyebrow", SHEET.eyebrow || ""));
    // Version badges. templateVersion is the stamp from template-check.cjs;
    // sheetVersion is which round of THIS questionnaire the reader is seeing.
    // How old, in words. Same shape as the changelog fold line.
    function verAge(iso) {
      if (!iso) return "";
      var ms = Date.now() - Date.parse(iso);
      if (isNaN(ms)) return "";
      var mins = Math.round(ms / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return mins + " min ago";
      var hrs = Math.round(mins / 60);
      if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
      var days = Math.round(hrs / 24);
      return days + (days === 1 ? " day ago" : " days ago");
    }
    function verDate(iso) {
      if (!iso) return "";
      var d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      return d.toLocaleDateString(undefined, { day: "numeric", month: "short" })
        + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    }
    // A value may be a plain string, or { id, at, note } for the fuller badge.
    function verBadge(label, value, tip) {
      var id = value, at = "", note = "", hash = "";
      if (value && typeof value === "object") { id = value.id; at = value.at; note = value.note; hash = value.hash; }
      if (!id) return null;
      var b = el("div", "ver");
      var when = verDate(at), age = verAge(at);
      b.title = [tip, note, at ? "Changed " + when + (age ? " (" + age + ")" : "") : "",
        hash ? "Content hash " + hash : ""].filter(Boolean).join(" — ");
      b.appendChild(el("b", null, label));
      b.appendChild(el("span", null, id));
      if (note) b.appendChild(el("i", null, note));
      if (when) b.appendChild(el("i", null, when + (age ? ", " + age : "")));
      return b;
    }
    function addVer(container, label, value, tip) {
      var node = verBadge(label, value, tip);
      if (node) container.appendChild(node);
    }
    // Built fresh on each call. The same badges show at the top and again
    // under the button bar, and one node cannot sit in two places at once.
    function buildVersions(extraClass) {
      var box = el("div", "versions" + (extraClass ? " " + extraClass : ""));
      addVer(box, "template", SHEET.templateVersion, "The question-sheet template this page was built from");
      addVer(box, "questionnaire", SHEET.sheetVersion, "Which round of this questionnaire is live");
      return box.childNodes.length ? box : null;
    }
    var vers = buildVersions();
    if (vers) head.appendChild(vers);
    head.appendChild(el("h1", null, SHEET.title || "Brief"));
    // WHAT THIS SHEET IS (2.70). The label names the block; the paragraph
    // says the subject of the whole sheet, never what one round changed.
    if (SHEET.lede) {
      var ledeWrap = el("div", "lede-wrap");
      ledeWrap.appendChild(el("div", "lede-lead", SHEET.ledeLabel || "What this sheet is"));
      ledeWrap.appendChild(el("p", "lede", SHEET.lede));
      head.appendChild(ledeWrap);
    }
    var facts = el("div", "facts");
    (SHEET.facts || []).forEach(function (f) { facts.appendChild(el("span", "fact", f)); });
    head.appendChild(facts);

    // WHAT THIS SHEET IS ABOUT, AS TAGS (2.28).
    //
    // A reader settled the category system on 2026-09-06. The reason is one
    // failure they named in round two: the same question asked twice, in two
    // conversations, because neither knew about the other. A tag is how one
    // sheet becomes findable from another.
    //
    // `categories` is a list of ids from categories.json in the skill folder.
    // An entry may be a plain id, or { id, label, overlap, alsoOn } once the
    // overlap check has run. `overlap: true` means the same tag is live on
    // another sheet, and `alsoOn` names it in the hover text.
    if ((SHEET.categories || []).length) {
      var cats = el("div", "cats");
      cats.appendChild(el("span", "cats-lead", "about"));
      SHEET.categories.forEach(function (c) {
        var id = (c && typeof c === "object") ? c.id : c;
        var label = (c && typeof c === "object" && c.label) ? c.label : id;
        var over = !!(c && typeof c === "object" && c.overlap);
        var tag = el("span", "cat-tag" + (over ? " overlap" : ""), label);
        if (over) {
          var also = (c.alsoOn || []).join(", ");
          tag.title = also
            ? "This topic is also live on: " + also
            : "This topic is also live on another sheet.";
        } else {
          tag.title = "A shared tag. Two sheets that carry it are working on the same topic.";
        }
        cats.appendChild(tag);
      });
      head.appendChild(cats);
    }

    // THE STATED STATUS, drawn on the page.
    //
    // It was read out of the published HTML and never shown. Two sessions hit
    // the same wall on 2026-08-29: an agent that set one saw no change and had
    // to assume its edit worked, and the field-diff guard could not see it at
    // all, because that guard only sees what the template RENDERS. A field no
    // guard can see is exactly how two earlier template features were lost.
    var st = SHEET.status;
    if (st && typeof st === "object" && st.state) {
      var STATES = {
        "waiting-on-you": ["your move", "you"],
        "blocked":        ["blocked", "blocked"],
        "working":        ["with Claude", "claude"],
        "done":           ["done", "done"],
        "parked":         ["parked", "parked"],
      };
      var known = STATES[st.state];
      var band = el("div", "stated " + (known ? known[1] : "unknown"));

      var pill = el("span", "stated-pill", known ? known[0] : st.state);
      band.appendChild(pill);

      var body = el("div", "stated-body");

      // THE COMMAND FIRST (2.29). `action` is one imperative sentence saying
      // what the reader should DO. It is required when the state is
      // waiting-on-you: a band that says "needs you" and never says what is
      // needed is worse than no band, because it spends attention and returns
      // nothing. A missing one is called out here rather than passed over.
      if (st.action) {
        body.appendChild(el("div", "stated-action", st.action));
      } else if (st.state === "waiting-on-you") {
        body.appendChild(el("div", "stated-action",
          "This says it needs you, but no action was written. Ask Claude what to do."));
      }

      if (st.headline) body.appendChild(el("div", "stated-head", st.headline));
      if (st.next) {
        var nx = el("div", "stated-next");
        nx.appendChild(el("b", null, "Next: "));
        nx.appendChild(document.createTextNode(st.next));
        body.appendChild(nx);
      }
      if (st.by) body.appendChild(el("div", "stated-by", st.by));
      band.appendChild(body);

      // An unrecognised word is shown as-is and called out, rather than being
      // silently treated as one of the five. The dashboard ignores it too.
      if (!known) {
        band.appendChild(el("div", "stated-warn",
          "This state is not one of the five words the dashboard reads, so it is ignored there."));
      }
      head.appendChild(band);
    }

    wrap.appendChild(head);

    // Built fresh on each call, for the same reason as the badges above.
    function buildSent() {
      var b = buildSentCore();
      if (b && !SAVED.draft && SAVED.told) {
        b.appendChild(el("span", "told" + (SAVED.told === "yes" ? "" : " not"), toldLine(SAVED.told)));
        if (SAVED.told !== "yes") b.className += " untold";
      }
      return b;
    }
    function buildSentCore() {
      if (!state.sentAt) return null;
      var banner = el("div", "sent" + (SAVED.draft ? " draft" : ""));
      banner.appendChild(el("span", "dot"));
      // The reader's own clock. toLocaleString with no locale argument asks
      // the browser, which follows the machine's timezone, so this reads
      // correctly wherever the page is opened (Remy, 2026-08-29).
      var when = new Date(state.sentAt);
      var shown = isNaN(when.getTime())
        ? state.sentAt
        : when.toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      var sentAge = verAge(state.sentAt);
      var wasDraft = !!SAVED.draft;
      if (SAVED.request && SAVED.request.kind === "start-task") {
        var sline = el("span", null, (SAVED.request.cancel ? "Task taken back on " : "Task start asked for on ") + shown
          + (sentAge ? " (" + sentAge + ")" : "") + ": " + (SAVED.request.label || "a task") + ".");
        sline.title = "Exactly: " + state.sentAt;
        banner.appendChild(sline);
        return banner;
      }
      if (SAVED.request && SAVED.request.kind === "new-task") {
        var tline = el("span", null, "New task asked for on " + shown
          + (sentAge ? " (" + sentAge + ")" : "")
          + (SAVED.request.where === "local"
            ? ": a task chip in the conversation. Press the chip to start it on this machine."
            : ": start it in the cloud. Claude puts its link on this page, under the version badges."));
        tline.title = "Exactly: " + state.sentAt;
        banner.appendChild(tline);
        return banner;
      }
      if (SAVED.request && SAVED.request.kind === "rule") {
        var rline = el("span", null, (SAVED.request.op === "drop"
            ? "Asked on " + shown + " to DROP a standing rule: "
            : "Asked on " + shown + " to keep a rule as standing: ")
          + "\u201C" + (SAVED.request.text || "").slice(0, 80) + "\u201D. "
          + "Claude changes its memory, then rebuilds this page.");
        rline.title = "Exactly: " + state.sentAt;
        banner.appendChild(rline);
        return banner;
      }
      if (SAVED.request && SAVED.request.kind === "ping") {
        var pline = el("span", null, "Asked on " + shown + (sentAge ? " (" + sentAge + ")" : "")
          + " whether a Claude session is listening. The answer appears under the version badges.");
        pline.title = "Exactly: " + state.sentAt;
        banner.appendChild(pline);
        return banner;
      }
      var asked = SAVED.request && SAVED.request.kind === "version-check";
      if (asked) {
        var aline = el("span", null, "Version check asked for on " + shown
          + (sentAge ? " (" + sentAge + ")" : "")
          + ". Claude answers it on this page, under the version badges.");
        aline.title = "Exactly: " + state.sentAt;
        banner.appendChild(aline);
        return banner;
      }
      var line = el("span", null,
        (wasDraft || SAVED.told !== "yes" ? "Answers saved on " : "Answers sent to Claude on ") + shown
        + (sentAge ? " (" + sentAge + ")" : "")
        + (wasDraft
            ? ". This was a draft, so Claude has not acted on it. Press Send when ready."
            : ". Change anything and send again."));
      // Keep the exact instant reachable, without putting it in the sentence.
      line.title = "Exactly: " + state.sentAt;
      banner.appendChild(line);
      return banner;
    }
    var sentTop = buildSent();
    if (sentTop) wrap.appendChild(sentTop);

    // THE TASK LIST AND THE DECISIONS SIT SIDE BY SIDE, AT THE TOP, SHUT.
    //
    // A reader asked for exactly this on 2026-08-31: "i like the task list and
    // decisions at the top. but perhaps put those two in side by side boxes
    // ... and i think make them start 'collapsed' by default. or better yet.
    // have a 'remember the state' of the box."
    //
    // So each box folds and starts shut. It carries a switch (2.71; a
    // two-sided COLLAPSED | EXPANDED toggle from 2.16 to 2.70), and the side
    // it is on is how the box opens next time, on this browser only. The pair
    // stacks on a narrow screen.
    var pair = el("div", "pair");
    wrap.appendChild(pair);

    // Per-box open state, remembered on this machine only.
    var readUi = readUiRoot, writeUi = writeUiRoot;

    // `opts.headNode` replaces the plain mono title, so a question can put its
    // number, its own words and its badges on the fold line (2.33). `opts.cls`
    // adds classes to the fold itself.
    function foldBox(id, title, countText, body, opts) {
      opts = opts || {};
      var ui = readUi();
      var mine = ui[id] || {};
      // `start` is the only stored value: how this box opens next time.
      // "open" or "closed". Anything else, including nothing, means closed.
      var startOpen = mine.start === "open";
      var det = document.createElement("details");
      det.className = "fold" + (opts.cls ? " " + opts.cls : "");
      det.open = startOpen;

      var sum = document.createElement("summary");
      sum.appendChild(el("span", "tri", "▸"));
      if (opts.headNode) sum.appendChild(opts.headNode);
      else sum.appendChild(el("span", "fold-title", title));
      if (countText) sum.appendChild(el("span", "count", countText));
      if (opts.tail) sum.appendChild(opts.tail);

      // A SWITCH (2.71). See the header. 2.16 drew two named sides, green for
      // the live one and red for the other; a reader said it gave no "at a
      // glance" feel, and picked sample A of four on the meta sheet (q29).
      //
      // The side the knob is on is how the box opens NEXT time, and a press
      // flips the box now as well. The word beside it names the state, so the
      // control still says what it remembers (the reason 2.16 replaced the
      // tick).
      var tog = document.createElement("button");
      tog.type = "button";
      tog.className = "startside";
      tog.setAttribute("role", "switch");
      var word = el("span", "sw-word", "");
      tog.appendChild(word);
      tog.appendChild(el("span", "sw-track", ""));
      function paint() {
        var open = det.open;
        tog.classList.toggle("on", open);
        tog.setAttribute("aria-checked", open ? "true" : "false");
        word.textContent = open ? "expanded" : "collapsed";
        tog.title = (open ? "Opens expanded" : "Opens collapsed")
          + " next time, on this browser only. Press to switch. Nothing is sent anywhere.";
      }
      // A click inside a summary would toggle the fold on its own, so the
      // event is stopped and the open state is set here instead.
      tog.addEventListener("click", function (ev) {
        ev.stopPropagation();
        ev.preventDefault();
        det.open = !det.open;
        var u = readUi();
        u[id] = { start: det.open ? "open" : "closed" };
        writeUi(u);
        paint();
      });
      sum.appendChild(tog);
      det.appendChild(sum);
      det.appendChild(body);

      // Opening the box by its heading counts as flipping the toggle, so the
      // two can never disagree about what happens next time.
      det.addEventListener("toggle", function () {
        var u = readUi();
        u[id] = { start: det.open ? "open" : "closed" };
        writeUi(u);
        paint();
      });

      paint();
      return det;
    }

    // What changed, round by round. Folded shut: it only ever grows, and the
    // reader wants today's answer far more often than last week's.
    if (SHEET.changelog && SHEET.changelog.length) {
      var log = document.createElement('details');
      log.className = 'log';
      var sum = document.createElement('summary');
      sum.appendChild(el('span', 'tri', '▸'));
      sum.appendChild(document.createTextNode(SHEET.changelogLabel || 'What changed'));
      // How long ago, in words. The fold line answers "is this current?"
      // without the reader doing date arithmetic.
      function since(iso) {
        if (!iso) return '';
        var ms = Date.now() - Date.parse(iso);
        if (isNaN(ms)) return '';
        var mins = Math.round(ms / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return mins + ' min ago';
        var hrs = Math.round(mins / 60);
        if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
        var days = Math.round(hrs / 24);
        return days + (days === 1 ? ' day ago' : ' days ago');
      }

      // The stamp is stored as UTC and shown in the reader's own clock, so the
      // times match what their machine says rather than mine.
      function stampText(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' })
          + ' · ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      }

      var newest = SHEET.changelog[0];
      if (newest) {
        var head = newest.name;
        var st = stampText(newest.at) || newest.when || '';
        if (st) head += ' · ' + st;
        var ago = since(newest.at);
        if (ago) head += ' · ' + ago;
        sum.appendChild(el('span', 'latest', head));
      }
      log.appendChild(sum);

      var logBody = el('div', 'body');
      SHEET.changelog.forEach(function (entry) {
        var box = el('div', 'entry');
        var when = el('div', 'when');
        when.appendChild(el('span', 'name', entry.name || ''));
        var stamp = stampText(entry.at) || entry.when || '';
        if (stamp) when.appendChild(el('span', 'clock', stamp));
        var howLong = since(entry.at);
        if (howLong) when.appendChild(el('span', 'ago', howLong));
        box.appendChild(when);
        var ul = el('ul');
        (entry.changes || []).forEach(function (c) {
          var li = document.createElement('li');
          var text = typeof c === 'string' ? c : c.text;
          var kind = typeof c === 'string' ? null : c.kind;
          if (kind) li.appendChild(el('span', 'tag ' + kind, kind));
          li.appendChild(document.createTextNode(text));
          ul.appendChild(li);
        });
        box.appendChild(ul);
        logBody.appendChild(box);
      });
      log.appendChild(logBody);
      wrap.appendChild(log);
    }

    // The running task list — what is done, in flight, blocked and waiting.
    if (SHEET.checklist && SHEET.checklist.length) {
      var MARKS = { done: '✓', doing: '▸', blocked: '⏸', todo: '○' };
      var box = el('div', 'tasks');
      var doneCount = SHEET.checklist.filter(function (t) { return t.state === 'done'; }).length;
      // The heading moved onto the fold line, so the shut box still says what
      // it holds and how far along it is.
      var bar = el('div', 'bar');
      var fill = document.createElement('span');
      fill.style.width = Math.round((doneCount / SHEET.checklist.length) * 100) + '%';
      bar.appendChild(fill);
      box.appendChild(bar);

      var seen = null;
      var ul = null;
      SHEET.checklist.forEach(function (t) {
        if (t.group && t.group !== seen) {
          seen = t.group;
          box.appendChild(el('div', 'group', t.group));
          ul = el('ul');
          box.appendChild(ul);
        }
        if (!ul) { ul = el('ul'); box.appendChild(ul); }
        var li = document.createElement('li');
        li.className = t.state || 'todo';
        var txt = el('span', 'txt');
        txt.appendChild(document.createTextNode(t.label));
        if (t.who) txt.appendChild(el('span', 'who', ' — ' + t.who));
        // THE ROW IS A REAL TASK (2.53). tasks-bridge.cjs turns an open row
        // into an Agora task linked to a plan-map feature, and --sync writes
        // the board's state back before every build. The chip says which task,
        // where it stands on the board, and who holds it.
        if (t.task && t.task.id) {
          var TASK_WORDS = { open: 'open', claimed: 'claimed', in_progress: 'in progress', blocked: 'blocked', done: 'done' };
          var chip = el('span', 'task-chip ' + (t.task.state || 'open'));
          chip.textContent = t.task.id + ' · ' + (TASK_WORDS[t.task.state] || t.task.state || 'open')
            + (t.task.state === 'done' && t.task.doneAt ? ' · ' + new Date(t.task.doneAt).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '')
            + (t.task.by && t.task.state !== 'done' ? ' · ' + t.task.by : '');
          chip.title = 'An Agora task, linked to the plan map as ' + (t.task.ref || '?')
            + '. The state was read from the board when this page was built.';
          txt.appendChild(chip);
        }
        // DONE WHEN (2.56). See the header. The count says how far, shut.
        var dw = (t.doneWhen || []).filter(function (c) { return c && c.text; });
        if (dw.length) {
          var metN = dw.filter(function (c) { return c.met; }).length;
          var dc = el('span', 'done-count' + (metN === dw.length ? ' all' : ''), metN + ' of ' + dw.length + ' met');
          dc.title = 'This task is done when every condition is met. Open the row to see them.';
          txt.appendChild(dc);
        }

        // 2.8: a row that DESCRIBES its work opens like a decision row.
        // `detail` says what the work is; `scope` lists the concrete steps;
        // `from` names the answers that produced it. Plain rows are unchanged.
        if (t.detail || (t.scope && t.scope.length) || t.from || dw.length) {
          var det = document.createElement('details');
          var sum = document.createElement('summary');
          sum.appendChild(el('span', 'mark', MARKS[t.state] || MARKS.todo));
          sum.appendChild(txt);
          det.appendChild(sum);
          var body = el('div', 'work');
          if (t.detail) body.appendChild(el('p', 'work-detail', t.detail));
          if (t.scope && t.scope.length) {
            var sl = el('ul', 'work-scope');
            t.scope.forEach(function (s) { sl.appendChild(el('li', null, s)); });
            body.appendChild(sl);
          }
          if (dw.length) {
            var dwb = el('div', 'done-when');
            dwb.appendChild(el('div', 'done-when-head', 'Done when'));
            var dwl = el('ul');
            dw.forEach(function (c) {
              var dli = el('li', c.met ? 'met' : 'open');
              dli.appendChild(el('span', 'dw-mark', c.met ? '✓' : '○'));
              dli.appendChild(el('span', 'dw-text', c.text));
              dwl.appendChild(dli);
            });
            dwb.appendChild(dwl);
            body.appendChild(dwb);
            var how = el('div', 'done-how');
            if (t.state === 'done') {
              how.appendChild(el('b', null, 'Done' + (t.task && t.task.doneAt ? ' on ' + new Date(t.task.doneAt).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '') + '. '));
              how.appendChild(document.createTextNode('Every condition is met, and the task is closed on the board.'));
            } else {
              how.appendChild(el('b', null, 'How you will know: '));
              how.appendChild(document.createTextNode('when the last condition is met, the task closes on the Agora board. '
                + (SHEET.watch
                  ? 'Claude (' + (SHEET.watch.by || 'the session for this sheet') + ') checks the board every minute and rebuilds this page when the task changes: '
                    + 'this row turns green with the date, and you get a push notification. The watch lasts only while that session is open. If it closes, the row moves on the next round.'
                  : 'Nothing watches the board for this sheet right now, so this row moves only on the next round, when Claude rebuilds the page.')));
            }
            body.appendChild(how);
          }
          if (t.from) body.appendChild(el('span', 'from', t.from));
          det.appendChild(body);
          li.appendChild(det);
        } else {
          li.appendChild(el('span', 'mark', MARKS[t.state] || MARKS.todo));
          li.appendChild(txt);
        }

        // START THIS NOW (2.37). Only on a row that is not done: a finished
        // task cannot be started, and a control that does nothing teaches the
        // reader to distrust the others.
        // A task someone already holds on the board needs no start button (2.53).
        var heldOnBoard = t.task && (t.task.state === 'claimed' || t.task.state === 'in_progress');
        if (t.state !== 'done' && !heldOnBoard) {
          li.appendChild(startButton(t, li));
        }
        ul.appendChild(li);
      });
      pair.appendChild(foldBox("tasks", SHEET.checklistLabel || "Task list",
        doneCount + " of " + SHEET.checklist.length + " done", box));
    }

    // Settled items stay visible as a record, but never as questions again.
    if (SHEET.settled && SHEET.settled.length) {
      var done = el("div", "settled");
      var list = el("ul");
      SHEET.settled.forEach(function (s) {
        var li = document.createElement("li");

        // The line every decision shows: a tick, what it was about, and what
        // was decided.
        var body = document.createElement("span");
        body.appendChild(el("span", "what", s.what + " "));
        body.appendChild(el("span", "verdict", s.verdict));
        // WHICH ROUND MADE IT REAL (2.54). A reader asked on 2026-09-12 for each
        // decision to show the questionnaire version it was implemented in.
        // build.cjs stamps a new decision with the version being built. Older
        // decisions carry version: null, and show nothing.
        if (s.version) {
          var vb = el("span", "decided-in", s.version);
          vb.title = "Implemented in questionnaire version " + s.version;
          body.appendChild(vb);
        }

        if (s.why || s.whyPlain || s.whyTech) {
          // With a reason recorded, the row opens to show it. Weeks later the
          // decision alone rarely explains itself; the reason does.
          //
