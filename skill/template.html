          // Two voices (2.3): `whyPlain` speaks to a person with no project
          // context; `whyTech` speaks to an agent, with exact paths and
          // numbers. Legacy `why` renders as the plain voice.
          var det = document.createElement("details");
          var sum = document.createElement("summary");
          sum.appendChild(el("span", "tick", "✓"));
          sum.appendChild(body);
          det.appendChild(sum);

          var why = el("div", "why");
          var plain = s.whyPlain || s.why;
          if (plain) {
            var pv = el("span", "voice plain");
            if (s.whyTech) pv.appendChild(el("span", "voice-tag", "In plain words"));
            pv.appendChild(document.createTextNode(plain));
            why.appendChild(pv);
          }
          if (s.whyTech) {
            var tv = el("span", "voice tech");
            tv.appendChild(el("span", "voice-tag", "For agents"));
            tv.appendChild(document.createTextNode(s.whyTech));
            why.appendChild(tv);
          }
          if (s.from) why.appendChild(el("span", "from", s.from));
          det.appendChild(why);
          li.appendChild(det);
        } else {
          li.appendChild(el("span", "tick", "✓"));
          li.appendChild(body);
        }

        list.appendChild(li);
      });
      done.appendChild(list);
      pair.appendChild(foldBox("settled", SHEET.settledLabel || "Decisions",
        String(SHEET.settled.length), done));
    }

    // HOW YOU DECIDE (2.68). See the header. The decisions say WHAT was
    // chosen; these say what the reader keeps choosing, which is the part
    // worth carrying into the next sheet and into Claude's own memory.
    if ((SHEET.principles || []).length) {
      var pr = el("div", "settled principles");
      pr.appendChild(el("p", null, SHEET.principlesWhy
        || "What your rulings add up to, in general terms. Correct any line that does not sound like you."));

      // HOW A STANDING RULE WORKS (2.69). Written on the page, because a
      // reader asked for the mechanism, and because the next agent to pick
      // this sheet up reads the page before it reads any skill.
      var how = el("p", "prin-how");
      how.appendChild(el("b", null, "What a standing rule is: "));
      how.appendChild(document.createTextNode(
        "a rule Claude keeps in its own memory, outside this page, and applies on every task. "
        + "This box is the only place you can see them together. "));
      how.appendChild(el("b", null, "The buttons: "));
      how.appendChild(document.createTextNode(
        "\u201Cmake it standing\u201D asks Claude to write that row into its memory. "
        + "\u201Cdrop this rule\u201D asks Claude to delete it from memory, and the row then reads DROPPED. "
        + "One press sends the request; there is nothing else to press. "
        + "Claude changes its memory first, then rebuilds this page, so the badge always states what its memory really holds."));
      pr.appendChild(how);

      // THE FILTER (2.69). Pills with counts, remembered per browser.
      var MEMS = [
        { key: "all", label: "all" },
        { key: "saved", label: "standing" },
        { key: "new", label: "new" },
        { key: "dropped", label: "dropped" }
      ];
      var puiKey = "principlesFilter";
      var live = readUiRoot()[puiKey] || "all";
      var counts = { all: SHEET.principles.length, saved: 0, "new": 0, dropped: 0 };
      SHEET.principles.forEach(function (p) {
        var k = p.memory === "saved" || p.memory === "dropped" ? p.memory : "new";
        counts[k]++;
      });
      if (!counts[live]) live = "all";
      var frow = el("div", "prin-filter");
      var pills = {};
      var rows = [];
      function paintFilter() {
        MEMS.forEach(function (m) {
          pills[m.key].className = "prin-pill" + (m.key === live ? " on" : "");
        });
        rows.forEach(function (r) {
          r.li.hidden = live !== "all" && r.mem !== live;
        });
      }
      MEMS.forEach(function (m) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "prin-pill";
        b.textContent = m.label + " " + counts[m.key];
        b.disabled = !counts[m.key];
        b.title = m.key === "all" ? "Show every rule."
          : m.key === "saved" ? "Show only the rules Claude keeps in its memory."
          : m.key === "new" ? "Show only the rules distilled here and not kept in memory."
          : "Show only the rules Claude was told to drop.";
        b.addEventListener("click", function () {
          live = m.key;
          var u = readUiRoot();
          u[puiKey] = m.key;
          writeUiRoot(u);
          paintFilter();
        });
        pills[m.key] = b;
        frow.appendChild(b);
      });
      pr.appendChild(frow);

      var plist = el("ul");
      SHEET.principles.forEach(function (p, i) {
        var mem = p.memory === "saved" || p.memory === "dropped" ? p.memory : "new";
        var li = document.createElement("li");
        if (mem === "dropped") li.className = "is-dropped";
        li.appendChild(el("span", "mark", "\u2022"));
        var body = document.createElement("span");
        var say = el("span", "say", p.text || "");
        var WORDS = { saved: "standing rule", "new": "new", dropped: "dropped" };
        var m = el("span", "mem " + mem, WORDS[mem]);
        m.title = mem === "saved"
          ? "Claude keeps this as a standing rule, outside this page."
          : mem === "dropped"
          ? "You dropped this one. Claude deleted it from its memory and does not apply it."
          : "Distilled here, and not in Claude's memory yet.";
        say.appendChild(m);

        // ONE PRESS, NOT TWO (2.51, applied here). The button sends its own
        // request, the way "start this now" does.
        var act = document.createElement("button");
        act.type = "button";
        act.className = "prin-act";
        var op = mem === "saved" ? "drop" : "keep";
        act.textContent = op === "drop" ? "drop this rule" : "make it standing";
        act.title = op === "drop"
          ? "Ask Claude to delete this rule from its memory. The row then reads DROPPED."
          : "Ask Claude to write this rule into its memory, so it holds on every task.";
        act.addEventListener("click", function () {
          act.disabled = true;
          act.textContent = op === "drop" ? "asking\u2026" : "asking\u2026";
          send(null, false, { kind: "rule", op: op, i: i, text: p.text || "" }).then(function () {
            act.textContent = op === "drop" ? "drop asked" : "keep asked";
          }, function () {
            act.disabled = false;
            act.textContent = op === "drop" ? "drop this rule" : "make it standing";
          });
        });
        say.appendChild(act);

        body.appendChild(say);
        if (p.from) body.appendChild(el("span", "from", p.from));
        li.appendChild(body);
        plist.appendChild(li);
        rows.push({ li: li, mem: mem });
      });
      pr.appendChild(plist);
      paintFilter();
      pair.appendChild(foldBox("principles", SHEET.principlesLabel || "How you decide",
        counts.saved + " of " + SHEET.principles.length + " are standing rules", pr));
    }

    // The questions get a name too. Without one they read as loose cards after
    // the lists above, rather than as the part that wants an answer.
    if ((SHEET.questions || []).length) {
      var qHead = el('div', 'section-head');
      qHead.appendChild(document.createTextNode(SHEET.questionsLabel || 'Open questions'));
      qHead.appendChild(el('span', 'count', String(SHEET.questions.length)));
      if (SHEET.questionsHint) qHead.appendChild(el('span', 'hint', SHEET.questionsHint));

      // EXPAND ALL, COLLAPSE ALL (2.47). A reader left a note on this heading
      // on 2026-09-12: "can i get a 'collapse all' and 'expand all' button,
      // that collapses all questions or expands all questions?" Each fold
      // still remembers its own side, so pressing one of these also sets how
      // every question opens next time.
      if (SHEET.questions.length > 1) {
        var allRow = el('span', 'all-folds');
        [['expand all', true], ['collapse all', false]].forEach(function (pair) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'all-fold';
          b.textContent = pair[0];
          b.title = pair[1] ? 'Open every question.' : 'Shut every question.';
          b.addEventListener('click', function () {
            document.querySelectorAll('details.qfold').forEach(function (d) {
              if (d.classList.contains('reply') || d.classList.contains('meta')) return;
              d.open = pair[1];
            });
          });
          allRow.appendChild(b);
        });
        qHead.appendChild(allRow);
      }
      wrap.appendChild(qHead);
    }

    (SHEET.questions || []).forEach(function (q, i) {
      var flag = state.unclear[q.id];
      var sec = el("section", "q" + (flag && flag.on ? " flagged" : ""));
      // THE HEAD MOVES ONTO THE FOLD LINE (2.33). A reader asked for every
      // question to start collapsed, with the same collapsed/expanded toggle
      // the task list and the decisions already carry. A shut card must still
      // say which question it is, so its number, its own words and its badges
      // ride on the summary rather than inside the body.
      var qh = el("div", "q-head");
      qh.appendChild(el("span", "num", String(i + 1).padStart(2, "0")));
      qh.appendChild(el("h2", null, q.title));
      if (q.status) qh.appendChild(el("span", "badge " + q.status, q.status));
      // ASKED AGAIN because nothing was picked last round. A reader called
      // this out on 2026-08-31: an unanswered question that comes back looks
      // exactly like a new one, so the second chance is invisible. The build
      // sets `missed` — only it knows the carried answers held no pick and no
      // own text for this question.
      if (q.addressed && q.addressed.missed) {
        qh.appendChild(el("span", "badge missed", "asked again"));
      }
      if (q.why) sec.appendChild(el("p", "why", q.why));

      // WHAT I DID ABOUT YOUR LAST ANSWER, AND WHEN.
      //
      // A reader said it plainly on 2026-08-31: a re-asked question still
      // showed their old pick, so they could not tell whether anything had
      // changed. The pick is not the problem — the missing receipt is. This
      // band states that the question was acted on, at what time, and whether
      // that time falls AFTER they last pressed Send. A stamp older than
      // their send is marked stale, because it proves nothing.
      if (q.addressed) {
        var ad = q.addressed;
        var at = ad.at || "";
        var fresh = !state.sentAt || (at && Date.parse(at) >= Date.parse(state.sentAt));
        var band = el("div", "addressed" + (fresh ? "" : " stale"));
        var line = el("div", "addr-line");
        line.appendChild(el("span", "addr-mark", fresh ? "✓" : "!"));
        line.appendChild(el("span", "addr-word", fresh ? "Addressed" : "Addressed earlier"));
        if (at) {
          var when = verDate(at), age = verAge(at);
          var stampNode = el("span", "addr-when", when + (age ? " · " + age : ""));
          stampNode.title = "Exactly: " + at;
          line.appendChild(stampNode);
          if (state.sentAt) {
            var gap = Date.parse(at) - Date.parse(state.sentAt);
            var mins = Math.round(Math.abs(gap) / 60000);
            var span = mins < 60
              ? mins + " min"
              : Math.round(mins / 60) + (Math.round(mins / 60) === 1 ? " hour" : " hours");
            line.appendChild(el("span", "addr-rel",
              fresh ? span + " after you sent your answers" : span + " BEFORE your last answers"));
          }
        }
        band.appendChild(line);
        if (ad.missed) {
          band.classList.add("missed");
          band.appendChild(el("div", "addr-missed",
            "You picked nothing here last time, so the question comes back."));
        }
        if (ad.what) band.appendChild(el("div", "addr-what", ad.what));
        // The pick this question carried before. Shown here, so clearing the
        // boxes below never hides what the reader actually said.
        if (ad.was) band.appendChild(el("div", "addr-was", "You answered: " + ad.was));
        sec.appendChild(band);
      }

      // A CLARIFICATION HAS ONE SHAPE (2.50). A reader on 2026-09-12: each
      // clarification was "decided on the fly", so they had to rescan it from
      // the top every time to find their way. `clarify` draws the same five
      // rows, in the same order, on every rewritten question:
      //   flagged  what the reader said was wrong
      //   changed  what this round did about it
      //   what     the thing itself, in plain words
      //   stakes   what goes wrong if the choice is wrong
      //   example  one concrete case (optional)
      // A missing row is left out; the order never moves.
      if (q.clarify) {
        var CLARIFY_ROWS = [
          ["flagged", "You said"],
          ["changed", "What I changed"],
          ["what", "What this is"],
          ["stakes", "Why it matters"],
          ["example", "For example"]
        ];
        var cl = el("div", "clarify");
        cl.appendChild(el("div", "clarify-head", "Clarification"));
        CLARIFY_ROWS.forEach(function (row) {
          var v = q.clarify[row[0]];
          if (!v) return;
          var r = el("div", "clarify-row");
          r.appendChild(el("div", "clarify-k", row[1]));
          var val = el("div", "clarify-v");
          val.innerHTML = v;
          r.appendChild(val);
          cl.appendChild(r);
        });
        sec.appendChild(cl);
      }

      // An answer block reports what Claude found since the last round.
      if (q.answer) {
        var ans = el("div", "answer");
        ans.appendChild(el("div", "tag", q.answerTag || "Claude found"));
        var ansBody = document.createElement("div");
        ansBody.innerHTML = q.answer;
        ans.appendChild(ansBody);
        sec.appendChild(ans);
      }

      // A sample block shows a drawn mockup or a real screenshot.
      if (q.sample) {
        var samp = el("div", "sample");
        if (q.sampleCaption) samp.appendChild(el("div", "sample-cap", q.sampleCaption));
        var sampBody = document.createElement("div");
        sampBody.innerHTML = q.sample;
        samp.appendChild(sampBody);
        sec.appendChild(samp);
      }

      var opts = el("div", "opts");

      function severalAllowed() { return !!(q.multi || state.multi[q.id]); }

      // Set by the own-answer block below. Picking any other option must
      // clear the green edge on the own box, so the page never shows two
      // different answers as chosen at once.
      var refreshOwn = null;

      function drawOptions() {
        opts.textContent = "";
        refreshOwn = null;
        var several = severalAllowed();
        (q.options || []).forEach(function (o) {
          var lab = el("label", "opt");
          var input = document.createElement("input");
          input.type = several ? "checkbox" : "radio";
          input.name = q.id;
          input.value = o.label;
          var cur = state.picks[q.id];
          if (several) {
            input.checked = Array.isArray(cur)
              ? cur.indexOf(o.label) !== -1
              : cur === o.label;
          } else {
            input.checked = Array.isArray(cur) ? cur[0] === o.label : cur === o.label;
          }
          input.addEventListener("change", function () {
            if (severalAllowed()) {
              var list = [];
              opts.querySelectorAll("input").forEach(function (x) {
                if (x.checked) list.push(x.value);
              });
              state.picks[q.id] = list;
            } else {
              state.picks[q.id] = o.label;
            }
            if (refreshOwn) refreshOwn();
            persist();
          });
          var span = el("span", "label");
          var nameNode = el("span", "name", o.label);
          span.appendChild(nameNode);
          if (o.recommended) {
            lab.classList.add("rec");
            span.appendChild(el("span", "rec-badge", "recommended"));
          }
          if (o.extensive) span.appendChild(el("span", "tag-badge extensive", "most complete"));
          if (o.quick) span.appendChild(el("span", "tag-badge quick", "quick fix"));
          if (o.note) span.appendChild(el("span", "note", o.note));
          if (o.pro || o.con) {
            var pc = el("div", "pc");
            if (o.pro) {
              var pr = el("div", "pro");
              pr.appendChild(el("span", "k", "+"));
              pr.appendChild(el("span", "v", o.pro));
              pc.appendChild(pr);
            }
            if (o.con) {
              var cn = el("div", "con");
              cn.appendChild(el("span", "k", "\u2212"));
              cn.appendChild(el("span", "v", o.con));
              pc.appendChild(cn);
            }
            span.appendChild(pc);
          }
          if (o.recommended && o.whyRecommended) {
            span.appendChild(el("span", "why-rec", "Why I recommend it: " + o.whyRecommended));
          }
          lab.appendChild(input);
          lab.appendChild(span);
          var optWrap = el("div", "opt-wrap");
          optWrap.appendChild(lab);
          attachComment(optWrap, q.id, o.label, persist);
          opts.appendChild(optWrap);
        });

        // A pickable free-text answer. Not the notes box — this one is a choice.
        if (q.own !== false) {
          var OWN = "My own answer";
          var ownWrap = el("div", "own-wrap");
          var oLab = el("label", "opt");
          var oIn = document.createElement("input");
          oIn.type = several ? "checkbox" : "radio";
          oIn.name = q.id;
          oIn.value = OWN;
          var ownCur = state.picks[q.id];
          oIn.checked = Array.isArray(ownCur)
            ? ownCur.indexOf(OWN) !== -1
            : ownCur === OWN;
          var oSpan = el("span", "label");
          oSpan.appendChild(document.createTextNode(OWN));
          oSpan.appendChild(el("span", "note",
            q.ownNote || "None of the above. Write the answer you want and I will build to it."));
          oLab.appendChild(oIn);
          oLab.appendChild(oSpan);

          var oTa = document.createElement("textarea");
          oTa.className = "own-box";
          oTa.rows = 2;
          oTa.placeholder = q.ownPlaceholder || "Type your own answer";
          oTa.value = state.own[q.id] || "";

          function markChosen() {
            oTa.classList.toggle("is-chosen", oIn.checked);
          }

          function collect() {
            if (severalAllowed()) {
              var list = [];
              opts.querySelectorAll("input").forEach(function (x) {
                if (x.checked) list.push(x.value);
              });
              state.picks[q.id] = list;
            } else if (oIn.checked) {
              state.picks[q.id] = OWN;
            }
            markChosen();
            persist();
          }

          // Picking the option puts the caret in the box. One action, not two.
          oIn.addEventListener("change", function () {
            collect();
            if (oIn.checked) {
              oTa.focus();
              var end = oTa.value.length;
              try { oTa.setSelectionRange(end, end); } catch (e) {}
            }
          });

          /* Typing in the box IS choosing it. Earlier picks must survive, so
             the question switches to several-answers rather than clearing them. */
          function claimFromBox() {
            if (oIn.checked) return;
            var had = state.picks[q.id];
            var others = (Array.isArray(had) ? had : had ? [had] : [])
              .filter(function (v) { return v !== OWN; });
            if (others.length && !severalAllowed()) {
              state.multi[q.id] = true;
              if (typeof togBox !== "undefined" && togBox) togBox.checked = true;
              state.picks[q.id] = others.concat([OWN]);
              persist();
              var caret = oTa.selectionStart;
              drawOptions();
              var again = opts.querySelector("textarea.own-box");
              if (again) {
                again.focus();
                try { again.setSelectionRange(caret, caret); } catch (e) {}
              }
              return;
            }
            oIn.checked = true;
            if (!severalAllowed()) {
              opts.querySelectorAll("input").forEach(function (x) {
                if (x !== oIn) x.checked = false;
              });
            }
            collect();
          }

          oTa.addEventListener("focus", claimFromBox);
          oTa.addEventListener("input", function () {
            state.own[q.id] = oTa.value;
            claimFromBox();
            collect();
          });

          refreshOwn = markChosen;
          markChosen();
          ownWrap.appendChild(oLab);
          ownWrap.appendChild(oTa);
          attachComment(ownWrap, q.id, OWN, persist);
          opts.appendChild(ownWrap);
        }
      }

      drawOptions();
      sec.appendChild(opts);

      // ANSWER AND MOVE ON (2.61). See the header. One press keeps the pick,
      // shuts this card, and opens the next question with no answer.
      var nextRow = el("div", "nextq");
      var nextBtn = document.createElement("button");
      nextBtn.type = "button";
      nextBtn.className = "nextq-btn";
      var nextNote = el("span", "nextq-note", "");
      function nextOpenId() {
        var ids = (SHEET.questions || []).map(function (x) { return x.id; });
        var done = answeredIds();
        var here = ids.indexOf(q.id);
        var after = ids.slice(here + 1).filter(function (id) { return done.indexOf(id) === -1; });
        if (after.length) return after[0];
        var any = ids.filter(function (id) { return done.indexOf(id) === -1 && id !== q.id; });
        return any.length ? any[0] : null;
      }
      function paintNext() {
        var pickNow = state.picks[q.id];
        var has = (Array.isArray(pickNow) ? pickNow.length > 0 : !!pickNow)
          || !!state.own[q.id] || !!state.defer[q.id];
        var target = nextOpenId();
        nextBtn.disabled = !has;
        nextBtn.textContent = target
          ? "Keep this answer, and go to the next question"
          : "Keep this answer, and go to Send";
        nextBtn.title = has
          ? (target
              ? "Shuts this question and opens the next one with no answer. Your pick is already saved."
              : "Every other question has an answer. This shuts the card and goes to the Send bar.")
          : "Pick an option, or write your own answer, first.";
        nextNote.textContent = has
          ? (target ? "" : "every other question answered")
          : "no answer yet";
      }
      nextBtn.addEventListener("click", function () {
        var fold = sec.closest ? sec.closest("details.qfold") : null;
        if (fold) fold.open = false;                 // its toggle handler stores the side
        var target = nextOpenId();
        if (target) { jumpToQuestion(target); return; }
        var bar = document.querySelector("footer.actions");
        if (bar) bar.scrollIntoView({ behavior: "smooth", block: "center" });
      });
      nextRow.appendChild(nextBtn);
      nextRow.appendChild(nextNote);
      nextButtons.push(paintNext);
      paintNext();
      sec.appendChild(nextRow);

      // MORE OPTIONS (2.32). A reader asked on 2026-09-08 to hide the machinery
      // under each question behind one button, and to leave it unchanged when
      // opened. Four blocks live in here: convert to multiple choice, the three
      // hand-back buttons, the not-clear box, and send just this question.
      //
      // None of them is an answer. They are all controls ABOUT the question, and
      // stacked under every card they buried the two things that matter — the
      // choices, and the notes box.
      //
      // IT OPENS ITSELF WHEN THE READER HAS ALREADY USED IT. A hand-back, a
      // not-clear flag, a named reason or several-answers mode are all states
      // the reader set, and hiding a state behind a shut door means they cannot
      // see what they told me. Shut is for machinery nobody has touched.
      var more = document.createElement("details");
      more.className = "more";
      var moreSum = document.createElement("summary");
      moreSum.appendChild(el("span", "tri", "▸"));
      moreSum.appendChild(el("span", "more-title", "More options"));
      var moreWhy = el("span", "more-why", "");
      moreSum.appendChild(moreWhy);
      more.appendChild(moreSum);
      var moreBody = el("div", "more-body");
      more.appendChild(moreBody);

      // TURN ONE QUESTION INTO A MULTIPLE CHOICE (2.31).
      //
      // The control read "Let me pick more than one", which a reader asked to
      // clarify on 2026-09-08. That wording named a wish rather than a state:
      // it did not say what the control DOES, and it read the same whether the
      // question was already taking several answers or not.
      //
      // It now says which of the two states it will move you to, and which one
      // you are in. Off: "Convert to multiple choice" — press it and that is
      // what happens. On: "Multiple choice — pick as many as you like", so the
      // live state names itself instead of having to be worked out from a tick.
      if (!q.multi && (q.options || []).length > 1) {
        var tog = el("label", "multi-toggle");
        var togBox = document.createElement("input");
        togBox.type = "checkbox";
        togBox.checked = !!state.multi[q.id];
        var togText = document.createTextNode("");
        function paintMulti() {
          togText.nodeValue = togBox.checked
            ? "Multiple choice — pick as many as you like"
            : "Convert to multiple choice";
          tog.classList.toggle("on", togBox.checked);
          tog.title = togBox.checked
            ? "This question takes several answers. Untick to go back to one."
            : "This question takes one answer. Tick to allow several.";
        }
        togBox.addEventListener("change", function () {
          state.multi[q.id] = togBox.checked;
          if (!togBox.checked && Array.isArray(state.picks[q.id])) {
            state.picks[q.id] = state.picks[q.id][0] || "";
          }
          paintMulti();
          persist();
          drawOptions();
        });
        tog.appendChild(togBox);
        tog.appendChild(togText);
        paintMulti();
        moreBody.appendChild(tog);
      }

      var free = el("label", "free");
      free.appendChild(el("span", null, q.noteLabel || "Notes"));
      var ta = document.createElement("textarea");
      ta.rows = 1;
      ta.placeholder = q.placeholder || "";
      ta.value = state.notes[q.id] || "";
      ta.addEventListener("input", function () {
        state.notes[q.id] = ta.value;
        persist();
      });
      free.appendChild(ta);
      sec.appendChild(free);
      sec.appendChild(more);

      // THREE WAYS TO HAND A QUESTION BACK, none of which is silence.
      //
      // An empty question used to mean three things at once: decide it for me,
      // ask me later, and I never got there. Only the last one is real
      // silence. A reader picked this on 2026-08-31 and added the third
      // button themselves: some questions are a rabbit hole and deserve a
      // conversation of their own, with its own sheet.
      //
      // The page CANNOT open that conversation. It is a static page with no
      // way to reach the machine. It records the request; Claude opens the
      // thread and reports back. The button says so, rather than pretending.
      var DEFERS = [
        { id: "youdecide", label: "You decide this one",
          hint: "I hand it over. Claude picks, and says which default it chose." },
        { id: "later", label: "Ask me again next round",
          hint: "Not now. Keep it open and put it back on the next sheet." },
        { id: "spawn", label: "Give this its own thread",
          hint: "Too big for one question. A new-task card opens: a task chip on this machine, or a task in the cloud." }
      ];
      var deferRow = el("div", "defers");
      deferRow.appendChild(el("span", "defers-lead", "Or hand it back:"));
      DEFERS.forEach(function (d) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "defer" + (state.defer[q.id] === d.id ? " on" : "");
        b.textContent = d.label;
        b.title = d.hint;
        b.addEventListener("click", function () {
          if (state.defer[q.id] === d.id) delete state.defer[q.id];
          else state.defer[q.id] = d.id;
          deferRow.querySelectorAll("button.defer").forEach(function (x) {
            x.classList.remove("on");
          });
          if (state.defer[q.id] === d.id) b.classList.add("on");
          var pickedNote = deferRow.querySelector(".defer-note");
          if (pickedNote) pickedNote.remove();
          if (state.defer[q.id]) deferRow.appendChild(el("span", "defer-note", d.hint));
          persist();
          // The same card as the dock button, narrowed to this question (2.42).
          if (d.id === "spawn" && state.defer[q.id] === "spawn") openHandoff(q);
        });
        deferRow.appendChild(b);
      });
      if (state.defer[q.id]) {
        for (var di = 0; di < DEFERS.length; di++) {
          if (DEFERS[di].id === state.defer[q.id]) {
            deferRow.appendChild(el("span", "defer-note", DEFERS[di].hint));
          }
        }
      }
      moreBody.appendChild(deferRow);

      // "This was not clear" — and why. Claude reads these and redraws.
      var unc = el("div", "unclear");
      var head = el("label", "head");
      var headBox = document.createElement("input");
      headBox.type = "checkbox";
      headBox.checked = !!(state.unclear[q.id] && state.unclear[q.id].on);
      head.appendChild(headBox);
      head.appendChild(document.createTextNode("This question was not clear"));
      unc.appendChild(head);

      var why = el("div", "unclear-why");
      why.hidden = !headBox.checked;

      UNCLEAR_REASONS.forEach(function (r) {
        var lab = document.createElement("label");
        var box = document.createElement("input");
        box.type = "checkbox";
        var cur = state.unclear[q.id];
        box.dataset.reason = r.id;
        box.checked = !!(cur && cur.reasons && cur.reasons.indexOf(r.id) !== -1);
        box.addEventListener("change", function () {
          var list = [];
          why.querySelectorAll("input[data-reason]").forEach(function (x) {
            if (x.checked) list.push(x.dataset.reason);
          });
          state.unclear[q.id] = { on: true, reasons: list };
          headBox.checked = true;
          sec.classList.add("flagged");
          persist();
        });
        var txt = document.createElement("span");
        txt.appendChild(document.createTextNode(r.label));
        txt.appendChild(el("span", "hint", r.hint));
        lab.appendChild(box);
        lab.appendChild(txt);
        why.appendChild(lab);
      });

      // A reason the seven do not cover. The reader writes it here, and it
      // comes back in `newReasons`. Claude must then either add it to this
      // template for good, or say which existing reason already covers it.
      // Asked for by a reader on 2026-08-31: a one-off free-text answer dies
      // with the sheet, and the same gap then reappears on the next one.
      var addWrap = el("div", "reason-add");
      var addLab = el("label", "reason-add-label", "None of these? Name the reason yourself.");
      var addBox = document.createElement("textarea");
      addBox.rows = 2;
      addBox.placeholder = "The reason this question did not land, in your own words";
      addBox.value = state.newReasons[q.id] || "";
      addBox.addEventListener("input", function () {
        var v = addBox.value.trim();
        if (v) {
          state.newReasons[q.id] = addBox.value;
          state.unclear[q.id] = state.unclear[q.id] || { on: true, reasons: [] };
          state.unclear[q.id].on = true;
          headBox.checked = true;
          why.hidden = false;
          sec.classList.add("flagged");
        } else {
          delete state.newReasons[q.id];
        }
        persist();
      });
      addWrap.appendChild(addLab);
      addWrap.appendChild(addBox);
      var addNote = el("div", "reason-add-note", "A reason written here becomes a permanent option on every future sheet, unless Claude can show an existing reason already covers it.");
      addWrap.appendChild(addNote);
      why.appendChild(addWrap);

      headBox.addEventListener("change", function () {
        why.hidden = !headBox.checked;
        sec.classList.toggle("flagged", headBox.checked);
        if (headBox.checked) {
          state.unclear[q.id] = state.unclear[q.id] || { on: true, reasons: [] };
          state.unclear[q.id].on = true;
        } else {
          delete state.unclear[q.id];
          why.querySelectorAll("input").forEach(function (x) { x.checked = false; });
        }
        persist();
      });

      unc.appendChild(why);
      moreBody.appendChild(unc);

      // SEND JUST THIS QUESTION. It marks the answers with a focus, so Claude
      // acts on this one question and edits it in place. The whole page is
      // still republished — that is the only channel a published page has —
      // but Claude no longer re-reads the sheet to find what moved.
      var one = el("div", "sendone");
      var oneBtn = document.createElement("button");
      oneBtn.type = "button";
      oneBtn.className = "sendone-btn";
      oneBtn.textContent = "Send just this question";
      oneBtn.title = "Claude acts on this question alone, and answers it in place.";
      oneBtn.addEventListener("click", function () { send(q.id); });
      one.appendChild(oneBtn);
      var oneNote = el("span", "sendone-note",
        "Everything else you have typed still travels with it, unchanged.");
      one.appendChild(oneNote);
      moreBody.appendChild(one);

      // Say what is inside, and open on anything the reader has already set.
      var usedBits = [];
      if (state.multi[q.id]) usedBits.push("multiple choice");
      if (state.defer[q.id]) usedBits.push("handed back");
      if (state.unclear[q.id] && state.unclear[q.id].on) usedBits.push("flagged as not clear");
      if (state.newReasons[q.id]) usedBits.push("your own reason");
      if (usedBits.length) {
        more.open = true;
        more.classList.add("used");
        moreWhy.textContent = usedBits.join(" · ");
      } else {
        moreWhy.textContent = "several answers · hand it back · not clear · send this one";
      }

      // WHERE THIS QUESTION STANDS, on the fold line. A collapsed card that
      // says nothing about its own state would hide the reader's answer from
      // them, so the summary carries it: answered, flagged, handed back, or
      // still open.
      var pick = state.picks[q.id];
      var hasPick = Array.isArray(pick) ? pick.length > 0 : !!pick;
      var stand = [];
      if (hasPick || state.own[q.id]) stand.push("answered");
      if (state.defer[q.id]) stand.push("handed back");
      if (flag && flag.on) stand.push("not clear");
      var standNode = el("span", "q-stand" + (stand.length ? " set" : ""),
        stand.length ? stand.join(" · ") : "not answered yet");

      wrap.appendChild(foldBox("q-" + q.id, null, null, sec,
        { headNode: qh, cls: "qfold" + (flag && flag.on ? " flagged" : "") ,
          tail: standNode }));
    });

    // A box for feedback about this page itself, not about the subject.
    // SAY SOMETHING ABOUT THE WORK ITSELF (2.30).
    //
    // A reader hit this on 2026-09-06, on a sheet whose questions had all been
    // answered: "i'm also missing a field where i can enter just a general
    // reply about the questionnaire itself... the only option left for me to
    // send the answers through the send button are to fill something into the
    // 'About this sheet itself' field, which is technically about the template
    // and questionnaire itself, not so much about the general topic".
    //
    // Exactly right. There were two lanes and they were both wrong for this:
    // per-question notes vanish when the questions run out, and the meta box
    // is for the PAGE. A sheet with nothing open left no way to speak about
    // the SUBJECT, which is the one thing every sheet is actually for. This is
    // that lane. It always renders, so it is there before the questions run
    // out as well as after.
    var replyCfg = SHEET.reply || {};
    var replySec = el("section", "q reply");
    var replyHead = el("span", "q-head");
    replyHead.appendChild(el("h2", null, replyCfg.label || "Anything else about this work"));
    replySec.appendChild(el("p", "why", replyCfg.why
      || "Not about a single question, and not about this page. Anything you want to say about the subject itself — a doubt, a direction, a thing I have missed."));
    var rfree = el("label", "free");
    rfree.appendChild(el("span", null, replyCfg.fieldLabel || "Your reply"));
    var rta = document.createElement("textarea");
    rta.rows = 4;
    rta.placeholder = replyCfg.placeholder || "Say what you think. This reaches Claude with everything else when you press Send.";
    rta.value = state.reply || "";
    rta.addEventListener("input", function () {
      state.reply = rta.value;
      persist();
    });
    rfree.appendChild(rta);
    replySec.appendChild(rfree);
    var replyStand = el("span", "q-stand" + (state.reply ? " set" : ""),
      state.reply ? "you wrote something" : "empty");
    // A BOX CAN SIT BELOW THE SEND BAR (2.46). A reader on 2026-09-12 asked
    // for the box about the TOOL to go below "Send answers to Claude": it is
    // not part of answering the round. `reply.below` or `meta.below` moves
    // that box under the bar. Without it, the box stays above, as before.
    var belowBar = [];
    function place(node, below) { if (below) belowBar.push(node); else wrap.appendChild(node); }
    place(foldBox("q-__reply", null, null, replySec,
      { headNode: replyHead, cls: "qfold reply", tail: replyStand }), replyCfg.below);

    if (SHEET.meta) {
      var meta = el("section", "q meta");
      var metaHead = el("span", "q-head");
      metaHead.appendChild(el("h2", null, SHEET.meta.label || "About this page"));
      if (SHEET.meta.why) meta.appendChild(el("p", "why", SHEET.meta.why));
      var mfree = el("label", "free");
      mfree.appendChild(el("span", null, SHEET.meta.fieldLabel || "Your notes"));
      var mta = document.createElement("textarea");
      mta.rows = 3;
      mta.placeholder = SHEET.meta.placeholder || "";
      mta.value = state.notes.__meta || "";
      mta.addEventListener("input", function () {
        state.notes.__meta = mta.value;
        persist();
      });
      mfree.appendChild(mta);
      meta.appendChild(mfree);
      var metaStand = el("span", "q-stand" + (state.notes.__meta ? " set" : ""),
        state.notes.__meta ? "you wrote something" : "empty");
      place(foldBox("q-__meta", null, null, meta,
        { headNode: metaHead, cls: "qfold meta", tail: metaStand }), SHEET.meta.below);
    }

    var actions = el("footer", "actions");
    sendBtn = el("button", null, "Send answers to Claude");
    sendBtn.type = "button";
    sendBtn.addEventListener("click", function () { send(); });
    actions.appendChild(sendBtn);

    // SAVE TO THE PAGE (2.34). It read "Save without sending", and a reader
    // asked "isn't this default anyway?" — a fair question with an awkward
    // answer: YES. Every keystroke already calls persist(), so the answers are
    // saved the moment they are typed. The old label therefore named something
    // the page does on its own, and the button looked redundant.
    //
    // What it actually does is change WHERE. Typing saves to localStorage, on
    // this browser and nowhere else — a different machine, or cleared site
    // data, and it is gone. This writes the answers INTO the published page,
    // so they follow the reader anywhere, and marks them `draft` so Claude
    // does not act. The label now names that, and the bar states the automatic
    // save out loud, so the button no longer has to imply it.
    var saveBtn = el("button", "ghost", "Save to the page");
    saveBtn.type = "button";
    saveBtn.title = "Everything you type is already kept in THIS browser as you go. "
      + "This copies it onto the page itself, so it follows you to another device — "
      + "and Claude still does not act on it until you press Send.";
    saveBtn.addEventListener("click", function () { send(null, true); });
    actions.appendChild(saveBtn);

    var showBtn = el("button", "ghost", "Show as text");
    showBtn.type = "button";
    showBtn.addEventListener("click", function () {
      outNode.textContent = asText();
      outNode.hidden = false;
    });
    actions.appendChild(showBtn);

    var clearBtn = el("button", "ghost", "Clear");
    clearBtn.type = "button";
    clearBtn.addEventListener("click", function () {
      state.picks = {};
      state.notes = {};
      state.own = {};
      state.comments = {};
      state.multi = {};
      state.unclear = {};
      state.newReasons = {};
      state.defer = {};
      state.pageNotes = [];
      state.reply = "";
      persist();
      render();
      refreshCounts();
    });
    actions.appendChild(clearBtn);

    statusNode = el("span", "status", "");
    actions.appendChild(statusNode);

    // THE DOCK RIDES ON THE SEND BAR (2.20). It used to float just above the
    // bar, which put two stacked panels in the same corner. A reader asked for
    // one: "instead of it floating 'above' the send answers to claude bar, put
    // this 'foldable' ON the actual bar". The bar is already sticky, so the
    // controls stay in view at any scroll position exactly as before.
    var dock = buildDock();
    if (dock) actions.appendChild(dock);

    // The fact that made the save button look redundant, said plainly (2.34).
    // Without it a reader has to guess whether typing is safe, and guessing
    // wrong either way costs them: either they never press anything, or they
    // press Send when they only wanted to stop for a minute.
    actions.appendChild(el("div", "bar-note",
      "Everything you type is kept in this browser as you go. "
      + "Save to the page copies it onto the page so it follows you elsewhere. "
      + "Only Send asks Claude to act."));

    wrap.appendChild(actions);

    outNode = el("pre", "out");
    outNode.hidden = true;
    wrap.appendChild(outNode);

    // The boxes that asked to sit below the bar (2.46).
    belowBar.forEach(function (n) { wrap.appendChild(n); });

    // The reader presses Send down here, at the end of a long sheet. Repeat
    // the confirmation and the versions below the bar so the answer to "did
    // that work?" is where they are already looking (Remy, 2026-08-29).
    var sentFoot = buildSent();
    if (sentFoot) wrap.appendChild(sentFoot);
    var versFoot = buildVersions("foot");
    if (versFoot) {
      // ASK CLAUDE TO CHECK THE VERSION (2.39). A reader asked, on the thread
      // where the 2.36 panel was removed, whether the page could make "a very
      // specific call" to Claude, the way Send just this question does. It
      // can. The page cannot look for itself, but it can ASK. Claude runs the
      // check on the machine, where the template actually lives, and if a
      // newer one exists it rebuilds this page on it. The answer lands below.
      var pending = SAVED.request && SAVED.request.kind === "version-check";
      var chk = document.createElement("button");
      chk.type = "button";
      chk.className = "ver-ask" + (pending ? " pending" : "");
      // THE BUTTON ALWAYS COMES BACK (2.45). A reader on 2026-09-12: "the
      // checker button should return everytime (i should be able to keep
      // re-triggering it)". It locked while a request waited, and after a
      // click it stayed locked until the page was rebuilt. Now it is locked
      // only for the moment the save is in flight, then it returns. A
      // request that waits says so, and can be asked again.
      function paintChk(busy) {
        chk.disabled = !!busy;
        chk.textContent = busy ? "asking Claude…"
          : pending ? "check asked for — ask again" : "ask Claude to check the version";
      }
      paintChk(false);
      chk.title = pending
        ? "Claude has the request. The answer appears here when this page is rebuilt. You can ask again at any time."
        : "Claude checks the template on the machine and, if a newer one exists, rebuilds this page on it. Your answers are not sent as answers.";
      chk.addEventListener("click", function () {
        paintChk(true);
        send(null, false, "version-check").then(function () {
          pending = true;
          chk.className = "ver-ask pending";
          paintChk(false);
        }, function () { paintChk(false); });
      });
      wrap.appendChild(versFoot);

      // THE BUTTON SITS WITH ITS ANSWER (2.49). A reader on 2026-09-12: "it
      // would make more sense to have this button on the row below, next to
      // the text that says when it was checked." The button asks; that row
      // answers. They now share one row, right under the badges. With no check
      // yet, the row holds the button alone.
      var vc = SHEET.versionCheck;
      var vr;
      if (vc && vc.at) {
        // A RESULT OLDER THAN THE PAGE SAYS SO (2.45). A check from before the
        // last rebuild describes a page that no longer exists.
        var tvAt = (SHEET.templateVersion && SHEET.templateVersion.at) || "";
        var old = tvAt && Date.parse(vc.at) < Date.parse(tvAt);
        vr = el("div", "ver-result" + (vc.upgraded ? " moved" : "") + (old ? " old" : ""));
        vr.appendChild(el("b", null, "checked " + verDate(vc.at) + " · "));
        vr.appendChild(document.createTextNode((vc.said || "")
          + (old ? " (older than this page)" : "")));
      } else {
        vr = el("div", "ver-result");
      }
      vr.appendChild(chk);
      wrap.appendChild(vr);

      // IS ANYONE LISTENING (2.62). See the header. The page cannot watch for
      // a session; it can only ask and then count the wait out loud.
      var LATE_MS = 2 * 60 * 1000;
      var lis = SHEET.listener || null;
      var askedAt = (SAVED.request && SAVED.request.kind === "ping") ? SAVED.request.at : null;
      var answered = lis && lis.at && (!askedAt || Date.parse(lis.at) >= Date.parse(askedAt));
      var lrow = el("div", "listen-row");
      var lbtn = document.createElement("button");
      lbtn.type = "button";
      lbtn.className = "ver-ask";
      function paintListen(busy) {
        lbtn.disabled = !!busy;
        lbtn.textContent = busy ? "asking…" : "is anyone listening?";
        lrow.className = "listen-row" + (answered ? "" : askedAt
          ? (Date.now() - Date.parse(askedAt) > LATE_MS ? " late" : " waiting") : "");
        lrow.textContent = "";
        if (answered) {
          var took = lis.askedAt ? Math.max(0, Math.round((Date.parse(lis.at) - Date.parse(lis.askedAt)) / 1000)) : null;
          lrow.appendChild(el("b", null, "claude answered " + verDate(lis.at) + " · "));
          lrow.appendChild(document.createTextNode(
            (took === null ? "" : took + (took === 1 ? " second" : " seconds") + " after the ask. ")
            + (lis.by ? "Session: " + lis.by + ". " : "")
            + "A session was watching this page then; it may have closed since."));
        } else if (askedAt) {
          lrow.appendChild(el("b", null, "asked " + verAge(askedAt) + " · "));
          lrow.appendChild(document.createTextNode(
            Date.now() - Date.parse(askedAt) > LATE_MS
              ? "no answer yet. Nothing is watching this page, or the session is busy."
              : "no answer yet. The ask went out as a comment sent to Claude; if the line below says no one watches, no session got it."));
        } else {
          lrow.appendChild(el("b", null, "not asked · "));
          lrow.appendChild(document.createTextNode(
            "Press this to find out whether a Claude session watches this page."));
        }
        lrow.appendChild(lbtn);
      }
      lbtn.title = "Every request on this page needs a Claude session that watches it. This asks whether one does.";
      lbtn.addEventListener("click", function () {
        paintListen(true);
        send(null, false, "ping").then(function () {
          askedAt = new Date().toISOString();
          answered = false;
          paintListen(false);
        }, function () { paintListen(false); });
      });
      paintListen(false);
      wrap.appendChild(lrow);

      // WHO WATCHES NOW (2.64). The platform knows whether a Claude session
      // could take a comment right now. Ask it once at load; it posts nothing.
      var live = el("div", "listen-row waiting");
      live.appendChild(el("b", null, "watching now · "));
      live.appendChild(document.createTextNode("checking…"));
      wrap.appendChild(live);
      commentsGate.then(function (c) {
        return c && c.canSendToClaude ? c.canSendToClaude() : "off";
      }).then(null, function () { return "off"; }).then(function (v) {
        var SAYS = {
          available:    ["yes", "", "A Claude session watches this page. Send tells it."],
          no_session:   ["no one", " late", "No Claude session watches this page now. Send saves your answers but tells no one; say so in the chat."],
          writers_only: ["view only", " late", "You can comment here but not edit, so Send cannot tell Claude."],
          off:          ["cannot tell", " late", "This view cannot tell Claude. Send saves only; say so in the chat."]
        };
        var s = SAYS[v] || SAYS.off;
        live.className = "listen-row" + s[1];
        live.textContent = "";
        live.appendChild(el("b", null, "watching now: " + s[0] + " · "));
        live.appendChild(document.createTextNode(s[2]));
      });

      // TASKS STARTED FOR THE READER (2.42). Claude writes one row per start:
      // { askedAt, where, title, said, link, at }. A link is https, so it can
      // be clicked from this page.
      (SHEET.newTasks || []).forEach(function (t) {
        var r = el("div", "ver-result task-result" + (t.link ? "" : " moved"));
        r.appendChild(el("b", null, (t.where || "task") + " task · " + verDate(t.at || t.askedAt) + " · "));
        r.appendChild(document.createTextNode((t.title ? t.title + " — " : "") + (t.said || "")));
        if (t.link) {
          var a = document.createElement("a");
          a.href = t.link;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = " open it";
          r.appendChild(a);
        }
        wrap.appendChild(r);
      });


    }

    app.appendChild(wrap);
  }

  // START THIS NOW (2.37).
  //
  // THE PAGE CANNOT START WORK, and the button says so rather than pretending.
  // This document has the network shut off; Send is its only channel. So the
  // button RECORDS a request, which travels in the answers as `start`, and
  // Claude begins those rows first on the next round.
  //
  // The second half is for a reader who will not wait: a pressed row hands
  // over a starter message to paste into a new chat. That is the 2.27
  // hand-off, narrowed to one task.
  function startButton(task, li) {
    var key = task.id || task.label;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "task-start" + (state.start[key] ? " on" : "");
    btn.textContent = state.start[key] ? "start asked" : "start this now";
    btn.title = state.start[key]
      ? "Asked for. Press again to take it back."
      : "Ask Claude to start this one now. One press sends the request; there is nothing else to press.";

    var receipt = null;

    function drawReceipt() {
      if (receipt) { receipt.remove(); receipt = null; }
      if (!state.start[key]) return;
      receipt = el("div", "task-asked");
      receipt.appendChild(document.createTextNode(
        "Sent to Claude. Claude starts this one and marks the row when it is under way."));
      var copy = document.createElement("button");
      copy.type = "button";
      copy.className = "copy";
      copy.textContent = "copy a starter message";
      copy.title = "For a new chat, if you would rather not wait for the next round.";
      var said = el("span", "said", "");
      copy.addEventListener("click", function () {
        var msg = "Start this task now, from the sheet \"" + (SHEET.title || "Brief")
          + "\":\n\n" + task.label
          + (task.detail ? "\n\n" + task.detail : "")
          + ((task.scope && task.scope.length) ? "\n\n- " + task.scope.join("\n- ") : "")
          + "\n\nThe sheet is at " + location.href;
        var ok = function () { said.textContent = "copied"; said.className = "said"; };
        var bad = function () {
          said.textContent = "could not copy — the message is in the box below";
          said.className = "handoff-warn";
          var ta = document.createElement("textarea");
          ta.className = "handoff-link";
          ta.value = msg;
          receipt.appendChild(ta);
          ta.select();
        };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(msg).then(ok, bad);
          } else { bad(); }
        } catch (e) { bad(); }
      });
      receipt.appendChild(copy);
      receipt.appendChild(said);
      li.parentNode.insertBefore(receipt, li.nextSibling);
    }

    // ONE PRESS, NOT TWO (2.51). A reader on 2026-09-12: "why if i click
    // 'start this now' do i then still have to 'send'. can't that be a single
    // action?" It can. The press now SENDS a narrow request, the same way the
    // version check does (2.39): `request: { kind: "start-task", task, label }`.
    // Pressing a sent row again takes the request back, and sends that too.
    btn.addEventListener("click", function () {
      var taking = !!state.start[key];
      if (taking) {
        delete state.start[key];
      } else {
        state.start[key] = { label: task.label, at: new Date().toISOString() };
      }
      persist();
      btn.disabled = true;
      btn.textContent = taking ? "taking back…" : "sending…";
      send(null, false, { kind: "start-task", task: key, label: task.label, cancel: taking }).then(function () {
        btn.disabled = false;
        btn.className = "task-start" + (state.start[key] ? " on" : "");
        btn.textContent = state.start[key] ? "start asked" : "start this now";
        drawReceipt();
      }, function () {
        btn.disabled = false;
        btn.textContent = state.start[key] ? "start asked" : "start this now";
      });
    });

    // A request that survived a reload must show itself on the next paint,
    // once the row is in the document.
    setTimeout(drawReceipt, 0);
    return btn;
  }

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        picks: state.picks,
        notes: state.notes,
        own: state.own,
        comments: state.comments,
        multi: state.multi,
        unclear: state.unclear,
        newReasons: state.newReasons,
        defer: state.defer,
        pageNotes: state.pageNotes,
        start: state.start,
        reply: state.reply,
        touchedAt: new Date().toISOString()
      }));
    } catch (e) {}
    updateDock();
    refreshCounts();
    paintNextButtons();
  }

  function asText() {
    var lines = [String(SHEET.title || "Brief").toUpperCase() + " — answers", ""];
    (SHEET.questions || []).forEach(function (q, i) {
      var pick = state.picks[q.id];
      var note = state.notes[q.id];
      var own = state.own[q.id];
      var hasComment = Object.keys(state.comments[q.id] || {}).length > 0;
      var flag = state.unclear[q.id];
      var hasPick = Array.isArray(pick) ? pick.length > 0 : !!pick;
      if (!hasPick && !note && !own && !flag && !hasComment && !state.newReasons[q.id] && !state.defer[q.id]) return;
      lines.push((i + 1) + ". " + q.title);
      if (hasPick) lines.push("   > " + (Array.isArray(pick) ? pick.join(", ") : pick));
      if (own) lines.push("   own answer: " + own);
      var cmts = state.comments[q.id] || {};
      Object.keys(cmts).forEach(function (k) {
        lines.push("   comment on \"" + k + "\": " + cmts[k]);
      });
      if (note) lines.push("   note: " + note);
      if (flag && flag.on) {
        var names = (flag.reasons || []).map(function (id) {
          for (var j = 0; j < UNCLEAR_REASONS.length; j++) {
            if (UNCLEAR_REASONS[j].id === id) return UNCLEAR_REASONS[j].label;
          }
          return id;
        });
        lines.push("   NOT CLEAR" + (names.length ? ": " + names.join("; ") : ""));
      }
      if (state.newReasons[q.id]) lines.push("   NEW REASON: " + state.newReasons[q.id]);
      if (state.defer[q.id]) lines.push("   HANDED BACK: " + state.defer[q.id]);
      lines.push("");
    });
    if (state.pageNotes.length) {
      lines.push("NOTES ON PARTS OF THE PAGE");
      state.pageNotes.forEach(function (n) {
        lines.push("   on \"" + n.about + "\": " + n.note);
      });
      lines.push("");
    }
    var startKeys = Object.keys(state.start || {});
    if (startKeys.length) {
      lines.push("START THESE NOW");
      startKeys.forEach(function (k) {
        lines.push("   " + state.start[k].label);
      });
      lines.push("");
    }
    if (state.reply && state.reply.trim()) {
      lines.push("A REPLY ABOUT THE WORK");
      lines.push("   " + state.reply.trim());
      lines.push("");
    }
    if (state.notes.__meta) {
      lines.push("ABOUT THIS PAGE ITSELF");
      lines.push("   " + state.notes.__meta);
      lines.push("");
    }
    if (lines.length === 2) lines.push("(nothing answered yet)");
    return lines.join("\n");
  }

  function jsonBlock(id, value) {
    var text = JSON.stringify(value, null, 2).split("<").join("\\u003c");
    return '<script type="application/json" id="' + id + '">\n' + text + "\n<" + "/script>";
  }

  function buildDoc(answers) {
    var css = document.getElementById("css");
    var fonts = document.getElementById("fonts");
    var parts = [];
    parts.push("<!doctype html>");
    parts.push('<html lang="en"><head><meta charset="utf-8">');
    parts.push('<meta name="viewport" content="width=device-width, initial-scale=1">');
    parts.push("<title>" + (SHEET.title || "Brief") + "<" + "/title>");
    if (fonts) {
      parts.push('<link id="fonts" rel="stylesheet" href="' + fonts.getAttribute("href") + '">');
    }
    parts.push('<style id="css">' + (css ? css.textContent : "") + "<" + "/style>");
    parts.push("<" + "/head><body>");
    parts.push('<div id="app"><' + "/div>");
    parts.push(jsonBlock("sheet", SHEET));
    parts.push(jsonBlock("answers", answers));
    parts.push('<script id="runtime">' + RUNTIME + "<" + "/script>");
    parts.push("<" + "/body><" + "/html>");
    return parts.join("\n");
  }

  /* send() takes an optional question id. With one, the answers carry a
     `focus` naming that question, and Claude acts on it alone.

     THE WHOLE PAGE IS STILL REPUBLISHED, because that is the only channel a
     published page has: artifact.publish() replaces the document. There is no
     partial write. What `focus` removes is the READING cost — Claude opens the
     answers block, sees which question was sent, and edits that one in place
     instead of re-reading the sheet. A reader asked for exactly this on
     2026-09-01, and asked whether the whole thing must be rewritten. On the
     page's side: yes. On Claude's side: no. */
  // `request` (2.39) is a narrow ask, the way `focusId` is one question: the
  // page still republishes whole, because that is its only channel, but the
  // answers say exactly what is being asked, so Claude does that one thing.
  // SEND TELLS CLAUDE (2.64). See the header. Asked for once, at load.
  var commentsGate = (window.claude && window.claude.use)
    ? window.claude.use("comments").then(null, function () { return null; })
    : Promise.resolve(null);

  function toldLine(why) {
    var SAYS = {
      yes:                "Claude was told by a comment on this page. It answers in that thread or on the page.",
      claude_unavailable: "Claude was not told: no Claude session watches this page now. Say so in the chat.",
      consent_required:   "Claude was not told: the page may not comment for you yet. Send again and allow it, or say so in the chat.",
      forbidden:          "Claude was not told: comments from this page are off for you. Turn them on in the comment panel, or say so in the chat.",
      rate_limited:       "Claude was not told: too many sends in a short time. Wait a minute and send again, or say so in the chat.",
      off:                "Claude was not told: this view cannot comment. Say so in the chat."
    };
    return SAYS[why] || ("Claude was not told (" + why + "). Say so in the chat.");
  }

  // Resolves { ok, threadId } or { ok: false, why }. Never rejects.
  function wakeClaude(answers) {
    return commentsGate.then(function (c) {
      if (!c || !c.sendToClaude) return { ok: false, why: "off" };
      var what = answers.request ? answers.request.kind
        : answers.focus ? "one question, " + answers.focus.q : "answers";
      var text = "Sent from the page: " + what + ", at " + answers.sentAt + ".\n"
        + "Read the answers block on the page. If its sentAt is older than this, the save is still in flight: read the page again.";
      var prior = SAVED.claudeThread || null;
      var call = prior
        ? c.sendToClaude({ threadId: prior, text: text })
        : c.anchorFor(sendBtn).then(function (a) { return c.sendToClaude({ anchor: a, text: text }); });
      return call.then(function (r) {
        return { ok: true, threadId: r.threadId };
      }, function (err) {
        return { ok: false, why: (err && err.code) || "upstream_error" };
      });
    });
  }

  function send(focusId, draftOnly, request) {
    sendBtn.disabled = true;
    statusNode.textContent = draftOnly
      ? "Saving a draft…"
      : request ? "Asking Claude…"
      : (focusId ? "Sending one question…" : "Sending…");

    var gate = (window.claude && window.claude.use)
      ? window.claude.use("artifact")
      : Promise.resolve(null);

    // send() returns its promise (2.45), so a button can come back after it.
    return gate.then(function (artifact) {
      if (!artifact) {
        sendBtn.disabled = false;
        statusNode.textContent = "Cannot send from this view. Press Show as text and paste it into the chat.";
        outNode.textContent = asText();
        outNode.hidden = false;
        return;
      }
      var answers = {
        picks: state.picks,
        notes: state.notes,
        own: state.own,
        comments: state.comments,
        multi: state.multi,
        unclear: state.unclear,
        newReasons: state.newReasons,
        defer: state.defer,
        pageNotes: state.pageNotes,
        // START THESE (2.37). The rows the reader pressed "start this now" on.
        // Claude begins these first on the next round.
        start: state.start,
        reply: state.reply,
        focus: focusId ? { q: focusId, at: new Date().toISOString() } : null,
        // A NARROW REQUEST (2.39), such as { kind: "version-check", at }.
        // 2.42: a request may also be an object, such as a new task.
        request: request
          ? (typeof request === "string"
              ? { kind: request, at: new Date().toISOString() }
              : Object.assign({}, request, { at: new Date().toISOString() }))
          : null,
        // A DRAFT SAVE (2.26). A reader asked whether the page could save to
        // itself without sending. It cannot save any other way — saving IS
        // publishing, and that is the only channel — but it CAN say that this
        // save is not a request. With `draft` true, Claude records that the
        // answers moved and does nothing else until a real Send arrives.
        draft: !!draftOnly,
        sentAt: new Date().toISOString()
      };
      // Tell Claude BEFORE the save: the save reloads this page (2.64).
      var woke = { ok: false, why: "draft" };
      return (draftOnly ? Promise.resolve(woke) : wakeClaude(answers)).then(function (w) {
        woke = w;
        answers.claudeThread = w.ok ? w.threadId
          : (w.why === "not_found" ? null : (SAVED.claudeThread || null));
        answers.told = draftOnly ? null : (w.ok ? "yes" : w.why);
        try { sessionStorage.setItem(KEY + "-pending", JSON.stringify(answers)); } catch (e) {}
        return artifact.publish(buildDoc(answers));
      }).then(function () {
        sendBtn.disabled = false;
        statusNode.textContent = draftOnly
          ? "Saved as a draft. It travels with you, and Claude will not act on it."
          : request === "version-check"
          ? "Asked. Claude checks the template on the machine and answers on this page."
          : request === "ping"
          ? "Asked whether a session is listening."
          : (request && request.kind === "rule")
          ? (request.op === "drop"
              ? "Asked. Claude deletes that rule from its memory and rebuilds this page."
              : "Asked. Claude writes that rule into its memory and rebuilds this page.")
          : (request && request.kind === "start-task")
          ? (request.cancel ? "Taken back. Claude will not start that task." : "Sent. Claude starts that task.")
          : (request && request.kind === "new-task")
          ? (request.where === "local"
              ? "Asked. Claude puts a task chip in the conversation; press it to start the task."
              : "Asked. Claude starts the task in the cloud and puts its link on this page.")
          : (focusId
              ? "Sent that question. Claude acts on it alone."
              : "Saved to the page.");
        if (!draftOnly) statusNode.textContent += " " + toldLine(woke.ok ? "yes" : woke.why);
      }, function (err) {
        var code = err && err.code ? err.code : "upstream_error";
        sendBtn.disabled = false;

        // NAME THE FAILURE (2.26). A reader asked for exactly this: "just name
        // the failure so it can be troubleshot". A bare code says nothing a
        // person can act on, so each one now says what happened, what it means
        // and what to do — and keeps the code at the end for a search.
        var SAYS = {
          not_writer:       ["You are looking at this page, but you do not have permission to write to it.",
                             "Open it from your own gallery rather than a shared link."],
          not_granted:      ["This page was published without the permission it needs to save itself.",
                             "Claude must republish it with that permission turned on."],
          consent_required: ["The page asked to save itself and the request was not approved.",
                             "Press Send again and approve the prompt."],
          not_declared:     ["This copy of the page never asked for permission to save itself.",
                             "It is probably a saved or exported copy. Open the live page instead."],
          rate_limited:     ["Too many saves in a short time. The site is holding this one back.",
                             "Wait about a minute, then press Send again."],
          conflict:         ["Someone else saved this page while you were typing.",
                             "The page is reloading with their version. Check your answers survived, then send again."],
          network:          ["The save did not reach the site.",
                             "Check your connection, then press Send again."],
          upstream_error:   ["The site refused the save and did not say why.",
                             "Try once more. If it fails again, paste the text instead."]
        };
        var says = SAYS[code] || SAYS.upstream_error;
        statusNode.textContent = says[0] + " " + says[1] + " (" + code + ")";
        outNode.textContent = asText();
        outNode.hidden = false;
      });
    });
  }

  render();
  refreshCounts();
})();
</script>
